name: bel_admin
description: >-
  BilletEnLigne — the back office. Review an application, decide it, set what
  an operator negotiated, and settle the payments a rail never answered.
  Flutter web: our own team works from laptops, and the surface it drives is
  the one that reaches across every tenant.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
  # One string: which theme the person chose. Local storage on the web, a
  # tiny XML file on Android — the platform's own preference store rather
  # than a database of our own for a single key.
  shared_preferences: ^2.3.0
  bel_backoffice: ^0.1.0
  bel_client: ^0.1.0
  bel_contracts: ^0.1.0
  bel_design: ^0.1.0
  bel_domain: ^0.1.0
  bel_platform: ^0.1.0
  bel_localization: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Fingerprints the bundled catalog against the source (i18n_freshness_test).
  crypto: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    # Copied from packages/bel_localization/i18n by tool/sync_i18n.sh, for the
    # same reason the other two apps copy it: bel_localization is pure Dart
    # (the API imports it) so it cannot declare Flutter assets, and Flutter
    # refuses `..` in asset paths.
    # One line, and one line for good: the bundle is flat, so a new language
    # is a folder in packages/bel_localization/i18n and a row in
    # languages.yaml — never an edit here.
    - assets/i18n/
