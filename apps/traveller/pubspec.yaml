name: bel_traveller
description: >-
  BilletEnLigne — the traveller app. Search a route, choose a seat, hold it,
  pay, board. Built for the cheapest Android handset an operator's customers
  actually carry (ADR-0002).
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
  bel_client: ^0.1.0
  bel_contracts: ^0.1.0
  bel_design: ^0.1.0
  bel_domain: ^0.1.0
  bel_localization: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Fingerprints the bundled catalog against the source (i18n_freshness_test).
  crypto: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    # Copied from packages/bel_localization/i18n by tool/sync_i18n.sh.
    # `bel_localization` is pure Dart — the API imports it — so it cannot
    # declare Flutter assets itself, and Flutter refuses `..` in asset paths.
    # i18n_freshness_test.dart fails the build if this copy drifts.
    - assets/i18n/
    - assets/i18n/fr/
    - assets/i18n/fr/pages/
    - assets/i18n/fr/errors/
    - assets/i18n/fr/enums/
    - assets/i18n/fr/messages/
    - assets/i18n/fr/reference/
    - assets/i18n/en/
    - assets/i18n/en/pages/
    - assets/i18n/en/errors/
    - assets/i18n/en/enums/
    - assets/i18n/en/messages/
    - assets/i18n/en/reference/
