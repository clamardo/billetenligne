name: bel_traveller
description: >-
  BilletEnLigne — the traveller app. Search a route, choose a seat, hold it,
  pay, board. Built for the cheapest Android handset an operator's customers
  actually carry (ADR-0002).
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
  bel_client: ^0.1.0
  bel_contracts: ^0.1.0
  # HMAC, for the 30-second code under the QR. The same primitive the scanner
  # verifies it with — one implementation, or the two disagree at a door.
  bel_crypto: ^0.1.0
  bel_design: ^0.1.0
  bel_domain: ^0.1.0
  bel_localization: ^0.1.0
  # The Keychain and the Android Keystore (ADR-0013).
  bel_secure_store: ^0.1.0
  # Renders the QR. Taken as a dependency for the same reason the scanner
  # takes `mobile_scanner` to read one: an encoder is Reed-Solomon plus a
  # mask-scoring pass, and a subtle bug in either produces a code that looks
  # right on a screen and fails at a coach door in the sun. This is the one
  # artefact of the whole product a passenger cannot travel without.
  qr_flutter: ^4.1.0
  # A ticket that survives the process being killed (`09-roadmap.md`, Phase 3).
  #
  # `sqlite3` and hand-written SQL rather than an ORM, which is the same
  # choice the API makes against Postgres: there is one table and three
  # statements here, and a code generator plus a build step is a large thing
  # to carry for that. `sqlite3_flutter_libs` ships the engine itself, since
  # the Android system library is a version lottery across the handsets this
  # app is built for (ADR-0002).
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.0
  # Where the file goes.
  path_provider: ^2.1.5
  # Opens the card processor's hosted checkout in the handset's browser. The
  # card number is typed on the bank's page and never enters this app, which
  # is the whole reason the rail is shaped this way — carrying a card form
  # here would drag PCI scope onto a bus-ticket app.
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Fingerprints the bundled catalog against the source (i18n_freshness_test).
  crypto: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    # Copied from packages/bel_localization/i18n by tool/sync_i18n.sh.
    # `bel_localization` is pure Dart — the API imports it — so it cannot
    # declare Flutter assets itself, and Flutter refuses `..` in asset paths.
    # i18n_freshness_test.dart fails the build if this copy drifts.
    - assets/i18n/
    - assets/i18n/fr/
    - assets/i18n/fr/pages/
    - assets/i18n/fr/errors/
    - assets/i18n/fr/enums/
    - assets/i18n/fr/messages/
    - assets/i18n/fr/reference/
    - assets/i18n/en/
    - assets/i18n/en/pages/
    - assets/i18n/en/errors/
    - assets/i18n/en/enums/
    - assets/i18n/en/messages/
    - assets/i18n/en/reference/
