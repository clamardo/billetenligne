name: billetenligne

packages:
  - packages/**
  - services/**
  - apps/**

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: Static analysis across every package.
    run: dart analyze --fatal-infos

  layers:
    description: >-
      Enforce the onion dependency rule (ADR-0001). A rule that is not enforced
      by CI is a comment.
    run: dart run tool/check_layers.dart

  test:domain:
    description: >-
      Pure Dart, no containers, under five seconds. Runs on save. If it is
      slow, the code is in the wrong layer.
    run: dart test packages/bel_domain packages/bel_localization packages/bel_contracts packages/bel_crypto

  test:api:
    description: API unit tests — middleware, tenancy, idempotency.
    run: dart test services/api

  test:scanner:
    description: >-
      The boarding scanner: verdicts, offline boarding, manual fallback. Runs
      against genuinely Ed25519-signed demo tickets, because a demo that fakes
      its own verdict proves nothing.
    run: melos exec --scope=bel_scanner -- flutter test

  test:design:
    description: >-
      Kilo contrast gates. Accessibility is a build gate, not a review comment.
    run: melos exec --scope=bel_design -- flutter test

  smoke:api:
    description: >-
      Starts the real API and exercises it over real HTTP. Catches wiring bugs
      no unit test can reach — header casing and middleware ordering both
      shipped past a green suite.
    run: ./tool/smoke_api.sh

  test:schema:
    description: >-
      Applies every migration to a throwaway Postgres and asserts tenant
      isolation, the append-only trail and the double-entry balance actually
      hold. Requires Docker.
    run: ./infra/migrations/check.sh

  verify:
    description: Everything a pull request must pass.
    run: |
      melos run analyze && \
      melos run layers && \
      melos run test:domain && \
      melos run test:api && \
      melos run test:design && \
      melos run test:scanner && \
      melos run smoke:api && \
      melos run test:schema
