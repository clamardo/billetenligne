# Every secret this system reads, by name, with no values.
#
#   kubectl create secret generic bel-secrets -n billetenligne \
#     --from-literal=DATABASE_URL='postgres://bel_api:...@10.x.x.x/billetenligne' \
#     --from-literal=TICKETS__SIGNINGSEED='...' \
#     ...
#
# **Not applied by kustomize, and not in this repository with values in it.**
# A committed Secret is a committed secret: base64 is an encoding and every
# tool that shows you a manifest will decode it for you. This file exists so
# that "which secrets does a deployment need" has an answer that is reviewed
# in code review, rather than living in one person's terminal history.
#
# The two that a deployment cannot start without:
#
#   TICKETS__SIGNINGSEED   32 bytes of base64. Every ticket is signed with it.
#                          The API refuses to start without one when it is
#                          talking to a real database, and refuses the
#                          development seed by value — it is printed in this
#                          repository, so copying it here is the same accident
#                          wearing a costume. Generate one with:
#
#     dart -e "import 'dart:convert';import 'dart:math';print(base64Encode(List<int>.generate(32,(_)=>Random.secure().nextInt(256))));"
#
#   DATABASE_URL           the application user, `bel_api`, which is NOINHERIT
#                          and holds no privileges at all until a transaction
#                          declares a surface (ADR-0011). **Not** the owner —
#                          that is MIGRATE_DATABASE_URL, used by the Job and
#                          by nothing else.
apiVersion: v1
kind: Secret
metadata:
  name: bel-secrets
  namespace: billetenligne
type: Opaque
stringData:
  # ── the two that must exist ───────────────────────────────────────────────
  DATABASE_URL: ""
  TICKETS__SIGNINGSEED: ""

  # ── the owner connection, read by the migration Job alone ─────────────────
  MIGRATE_DATABASE_URL: ""

  # ── identity (ADR-0018) ───────────────────────────────────────────────────
  FIREBASE_PROJECT_ID: ""
  FIREBASE_CLIENT_EMAIL: ""
  FIREBASE_PRIVATE_KEY: ""

  # ── the second factor, which is the one secret the server must read back ──
  # Absent means TOTP seeds are stored in the clear, which is what a local
  # stack does and what this system did before the control existed. Rotating
  # it is deliberately not silent: a sealed row it cannot open throws.
  TOTP__ENCRYPTIONKEY: ""

  # ── messages (Azure Communication Services) ───────────────────────────────
  COMMS__CONNECTIONSTRING: ""
  # Blank until a sender number exists. The API answers 503 for the phone
  # channel while it is, rather than accepting a request and leaving somebody
  # waiting for an SMS that is never coming.
  COMMS__SMSFROM: ""

  # ── the object store: KYB documents, logos, ticket PDFs ───────────────────
  STORAGE__ACCOUNT: ""
  STORAGE__KEY: ""
  STORAGE__CONTAINER: ""
  STORAGE__ENDPOINT: ""

  # ── the rails ─────────────────────────────────────────────────────────────
  # None of these exists yet: every one is a contract and a set of secrets,
  # and the market file decides which are announced at all. A rail with no
  # credentials is refused by name rather than attempted (ADR-0006).
  MTN__SUBSCRIPTIONKEY: ""
  MTN__APIUSER: ""
  MTN__APIKEY: ""
  MTN__TARGETENVIRONMENT: ""
  MTN__BASEURL: ""
  MTN__DISBURSEMENTUSER: ""
  MTN__DISBURSEMENTKEY: ""
  MTN__DISBURSEMENTAPIKEY: ""
  AIRTEL__CLIENTID: ""
  AIRTEL__CLIENTSECRET: ""
  AIRTEL__BASEURL: ""
  AIRTEL__DISBURSEMENTPIN: ""
  ORANGE__CLIENTID: ""
  ORANGE__CLIENTSECRET: ""
  ORANGE__MERCHANTKEY: ""
  ORANGE__BASEURL: ""
  ORANGE__COUNTRY: ""
  CARD__SITEID: ""
  CARD__APIKEY: ""
  CARD__BASEURL: ""
