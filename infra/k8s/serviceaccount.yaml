---
# One Kubernetes identity for everything this system runs, and the annotation
# that makes it a Google one.
#
# **Workload Identity is already enabled on the cluster** (see the Terraform
# module) and nothing was bound to it, which is a trap rather than an
# omission: with it on, a pod using the `default` service account has **no**
# Google credentials at all. The node service account it would have borrowed
# is deliberately unreachable. So the first thing here to call a Google API —
# Secret Manager, a bucket, Cloud Trace — would fail with a metadata-server
# error that says nothing about service accounts, months after this decision
# was taken and by somebody who did not take it.
#
# It grants nothing today. `bel-workload@PROJECT` is created by Terraform with
# no role bindings, because an identity that exists and can do nothing is the
# correct starting point — inventing permissions now, for a call nobody has
# written, is how a workload ends up with `roles/editor`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bel
  namespace: billetenligne
  annotations:
    # Substituted by deploy.sh, the same way the image references are.
    iam.gke.io/gcp-service-account: bel-workload@PROJECT.iam.gserviceaccount.com
