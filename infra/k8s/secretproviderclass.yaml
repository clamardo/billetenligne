---
# Where the secrets come from, and how they arrive.
#
# **Requires the Secret Manager add-on**, exactly as the ScaledJobs require
# KEDA:
#
#   gcloud container clusters update <cluster> --location <zone> \
#     --enable-secret-manager
#
# Without it the CSI driver does not exist, the volume never mounts, and every
# pod sits in `ContainerCreating` — which is at least loud, unlike the KEDA
# failure next door.
#
# **They arrive as files, not as environment variables.** `BEL__SECRETSDIR`
# points the API and the worker at the mount, and `Env.resolve` reads one
# variable per file. An environment is inherited by every child process, sits
# in `/proc/self/environ` for anything that can read the process, and is
# copied into crash dumps; a file has permissions, is read once at startup,
# and is **rewritten in place when the secret rotates** rather than needing
# the pod recreated.
#
# **No `secretObjects` here on purpose.** The driver can sync a mounted secret
# back into a Kubernetes Secret for `envFrom` to read. That would put every
# value into etcd as base64 — which is an encoding — and undo the reason for
# mounting them.
#
# `PROJECT` is substituted by `deploy.sh`, like the image references.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bel-secrets
  namespace: billetenligne
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT/secrets/AIRTEL__CLIENTID/versions/latest"
        path: "AIRTEL__CLIENTID"
      - resourceName: "projects/PROJECT/secrets/AIRTEL__CLIENTSECRET/versions/latest"
        path: "AIRTEL__CLIENTSECRET"
      - resourceName: "projects/PROJECT/secrets/AIRTEL__DISBURSEMENTPIN/versions/latest"
        path: "AIRTEL__DISBURSEMENTPIN"
      - resourceName: "projects/PROJECT/secrets/CARD__APIKEY/versions/latest"
        path: "CARD__APIKEY"
      - resourceName: "projects/PROJECT/secrets/CARD__SITEID/versions/latest"
        path: "CARD__SITEID"
      - resourceName: "projects/PROJECT/secrets/COMMS__CONNECTIONSTRING/versions/latest"
        path: "COMMS__CONNECTIONSTRING"
      - resourceName: "projects/PROJECT/secrets/DATABASE_URL/versions/latest"
        path: "DATABASE_URL"
      - resourceName: "projects/PROJECT/secrets/FIREBASE_CLIENT_EMAIL/versions/latest"
        path: "FIREBASE_CLIENT_EMAIL"
      - resourceName: "projects/PROJECT/secrets/FIREBASE_PRIVATE_KEY/versions/latest"
        path: "FIREBASE_PRIVATE_KEY"
      - resourceName: "projects/PROJECT/secrets/MIGRATE_DATABASE_URL/versions/latest"
        path: "MIGRATE_DATABASE_URL"
      - resourceName: "projects/PROJECT/secrets/MTN__APIKEY/versions/latest"
        path: "MTN__APIKEY"
      - resourceName: "projects/PROJECT/secrets/MTN__APIUSER/versions/latest"
        path: "MTN__APIUSER"
      - resourceName: "projects/PROJECT/secrets/MTN__DISBURSEMENTAPIKEY/versions/latest"
        path: "MTN__DISBURSEMENTAPIKEY"
      - resourceName: "projects/PROJECT/secrets/MTN__DISBURSEMENTKEY/versions/latest"
        path: "MTN__DISBURSEMENTKEY"
      - resourceName: "projects/PROJECT/secrets/MTN__DISBURSEMENTUSER/versions/latest"
        path: "MTN__DISBURSEMENTUSER"
      - resourceName: "projects/PROJECT/secrets/MTN__SUBSCRIPTIONKEY/versions/latest"
        path: "MTN__SUBSCRIPTIONKEY"
      - resourceName: "projects/PROJECT/secrets/ORANGE__CLIENTID/versions/latest"
        path: "ORANGE__CLIENTID"
      - resourceName: "projects/PROJECT/secrets/ORANGE__CLIENTSECRET/versions/latest"
        path: "ORANGE__CLIENTSECRET"
      - resourceName: "projects/PROJECT/secrets/ORANGE__MERCHANTKEY/versions/latest"
        path: "ORANGE__MERCHANTKEY"
      - resourceName: "projects/PROJECT/secrets/STORAGE__KEY/versions/latest"
        path: "STORAGE__KEY"
      - resourceName: "projects/PROJECT/secrets/TICKETS__SIGNINGSEED/versions/latest"
        path: "TICKETS__SIGNINGSEED"
      - resourceName: "projects/PROJECT/secrets/TOTP__ENCRYPTIONKEY/versions/latest"
        path: "TOTP__ENCRYPTIONKEY"
