---
apiVersion: v1
kind: Service
metadata:
  name: bel-api
  namespace: billetenligne
  labels:
    app: bel-api
  annotations:
    # The GKE ingress health-checks the backend itself rather than trusting
    # the pod's readiness probe, and it defaults to `/`. That works here — `/`
    # answers the JSON stub to anything that does not ask for HTML — but the
    # honest target is the one that knows.
    cloud.google.com/backend-config: '{"default": "bel-api-backend"}'
spec:
  type: ClusterIP
  selector:
    app: bel-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: bel-api-backend
  namespace: billetenligne
spec:
  healthCheck:
    type: HTTP
    requestPath: /ready
    port: 8080
  # A seat map on a 2G connection is a slow request, not a failed one.
  timeoutSec: 60
