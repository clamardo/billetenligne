# Everything the API reads from the environment that is not a secret.
#
# The secrets are next door in a Secret this repository does not contain — see
# `secrets.example.yaml`, which lists every key by name and holds no value.
#
# Read `infra/dev/.env.example` for what each of these means. What is here is
# the deployment's answers, and three of them decide behaviour rather than
# addresses:
#
#   BEL__ENV          production, and the default. A process with no ticket
#                     signing seed refuses to start unless this says
#                     development, which no deployment does.
#   BEL__WEBORIGINS   which browser origins may call this API. Empty means
#                     none, and the console is a browser.
#   BEL__SCREENING    absent. The demo screening adapter approves seeded
#                     companies only, but a variable that reads as harmless is
#                     a variable somebody sets in the wrong place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bel-api-env
  namespace: billetenligne
data:
  BEL__ENV: "production"
  PORT: "8080"

  # Where the secrets are, as files. See `secretproviderclass.yaml` — an
  # environment is inherited by every child process and sits in
  # /proc/self/environ; a file has permissions and rotates in place. A
  # directory named here and not mounted refuses to start rather than falling
  # back to the in-memory composition and serving invented departures.
  BEL__SECRETSDIR: "/etc/bel/secrets"

  # Where this deployment answers. `PUBLIC_BASE_URL` is what a payment rail
  # calls back on and has to be reachable from outside; `BEL__SHAREBASEURL` is
  # printed on every share link and every ticket link a traveller sends to
  # whoever is meeting them.
  PUBLIC_BASE_URL: "https://blt.cg"
  BEL__SHAREBASEURL: "https://blt.cg"

  # The console and the back office, exactly as a browser sees them. Scheme
  # and port are part of an origin: the plain-HTTP twin of an HTTPS console is
  # a different origin and is deliberately not on this list.
  BEL__WEBORIGINS: "https://console.blt.cg,https://admin.blt.cg"

  # The landing page at `/`. No store listing exists yet, and while these are
  # blank that page says the app is not published rather than showing a button
  # that goes nowhere.
  BEL__PLAYSTOREURL: ""
  BEL__APPSTOREURL: ""
  BEL__CONSOLEURL: "https://console.blt.cg"

  # Email works; the phone channel is announced only once a sender number
  # exists (ADR-0019).
  COMMS__EMAILFROM: "billets@blt.cg"
  COMMS__SMSFROM: ""

  # ── not secrets, though they arrived as ones ──────────────────────────────
  #
  # A secret is a value that would let somebody act as us. A hostname, a
  # container name, a project id and a sender number are none of those, and
  # every one of these started in the Secret next door.
  #
  # Keeping them there cost three things. They could not be reviewed in a pull
  # request — the Secret is not in this repository, so "which MTN host is
  # production pointed at" was answerable only by somebody with cluster
  # access. Changing one meant a secret-rotation ceremony for an edit that is
  # a URL. And a Secret that is mostly configuration is a Secret people get
  # casual about, which is the opposite of the point.
  #
  # **A blank here is an unset variable**, and that is a decision taken in the
  # code rather than a property of Kubernetes. A ConfigMap is a map of strings
  # and has no way to say *no value*, while everything downstream reads
  # `env['X'] ?? 'a default'` — so a blank would replace a working sandbox
  # host with `Uri.parse('')` and every call to that rail would fail against
  # nothing. `Env.present` drops the empties at startup, in both processes, so
  # the key can be listed here before the value exists.
  FIREBASE_PROJECT_ID: ""
  STORAGE__ACCOUNT: ""
  STORAGE__CONTAINER: "bel-assets"
  STORAGE__ENDPOINT: ""

  # The rails' hosts. Sandbox and production are different addresses, and
  # which one a deployment is pointed at is exactly the sort of thing that
  # should be visible in a diff rather than in a terminal.
  MTN__BASEURL: ""
  MTN__TARGETENVIRONMENT: ""
  AIRTEL__BASEURL: ""
  ORANGE__BASEURL: ""
  ORANGE__COUNTRY: "CG"
  CARD__BASEURL: ""

  # Which rails this market announces. The file is in the image; naming it
  # here would mean a rail switch needed a rebuild.
  BEL_MARKETS_FILE: "/app/config/markets.yaml"
