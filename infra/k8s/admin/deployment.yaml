---
# The back office: a Flutter web bundle behind unprivileged nginx.
#
# Two replicas, spread across nodes. It shipped with one and an argument that
# static files for a handful of our own people do not need two — which was
# about rollouts, and a rollout is not what takes this down. A node drain
# evicts the only pod, and the back office is where a payment that went wrong
# is resolved and where an operator waiting on a 48-hour review is approved.
# See `web-availability.yaml`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bel-admin
  namespace: billetenligne
  labels:
    app: bel-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bel-admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bel-admin
    spec:
      # Not `default`: Workload Identity is on, and a pod on the default
      # service account has no Google credentials at all.
      serviceAccountName: bel
      # One per node. Two replicas the scheduler put side by side are one
      # replica the moment that node is drained.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: bel-admin
      securityContext:
        runAsNonRoot: true
        # The unprivileged nginx image's own user. It listens on 8080 because
        # a container that has to be root to serve static files is asking for
        # a privilege it does not need.
        runAsUser: 101
      containers:
        - name: bel-admin
          image: bel-admin
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # nginx writes its temp files under /var/cache and /tmp, so the root
          # filesystem is not read-only here. Named rather than silently
          # different from the API's.
      terminationGracePeriodSeconds: 30
