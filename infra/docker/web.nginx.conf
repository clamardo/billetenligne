# One Flutter web bundle, served as a single-page app.
#
# **Every header is set once, at the server level, and nowhere else.** nginx
# inherits `add_header` only into blocks that declare none of their own, so a
# `location` that sets one cache header silently drops the whole security set
# — and because `try_files` rewrites a deep link to `/index.html`, that is the
# block *most* requests end up in. The first version of this file did exactly
# that and served the app with no CSP and no frame refusal at all.
#
# So the per-file cache policy is a map rather than a location, and `$uri` is
# read after the rewrite, which is what makes it work.
map $uri $bel_cache {
  # Content-hashed by the build, so it can be cached hard.
  default                      "public, max-age=2592000, immutable";
  # These two are not hashed, and they name everything that is. Caching them
  # pins somebody to the release before this one until they clear the browser.
  "/index.html"                "no-cache, must-revalidate";
  "/flutter_service_worker.js" "no-cache, must-revalidate";
  "/manifest.json"             "no-cache, must-revalidate";
}

server {
  # Unprivileged nginx: 8080 rather than 80, because a container that has to
  # be root to serve static files is asking for a privilege it does not need.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Every route is index.html. A Flutter app owns its own routing, and a
  # refresh on a deep link must not be a 404 from the file system.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header Cache-Control $bel_cache always;

  # This is a back office, not a shop window. Nobody links to it, nobody
  # embeds it, and a search engine that indexed it would be indexing the login
  # page for a company's whole timetable.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Flutter web compiles to JavaScript and, on the canvaskit renderer, loads
  # WebAssembly — which is why `wasm-unsafe-eval` is here, and why it is not
  # the blanket `unsafe-eval` it would have been easier to write. `connect-src`
  # reaches the API and Firebase, both https and neither on this origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;
}
