<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BilletEnLigne">
  <!--
    One-bit version, for thermal ticket printers and fax-grade reproduction.

    Same geometry, inverted: the ticket is an outline rather than a fill, so an
    80mm thermal head is not asked to lay down a solid block it will smear.
    Nothing here relies on colour, opacity or anti-aliasing.
  -->
  <defs>
    <mask id="bel-notch-mono">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="12" cy="32" r="4.5" fill="#000"/>
      <circle cx="52" cy="32" r="4.5" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#bel-notch-mono)">
    <rect x="13" y="20" width="38" height="24" rx="4.5"
          fill="none" stroke="#000" stroke-width="2.5"/>
  </g>

  <line x1="41" y1="23" x2="41" y2="41"
        stroke="#000" stroke-width="1.6"
        stroke-linecap="round" stroke-dasharray="1.6 2.6"/>

  <g stroke="#000" fill="#000">
    <line x1="20" y1="37" x2="33" y2="27"
          stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="20" cy="37" r="2.8"/>
    <circle cx="33" cy="27" r="2.8"/>
  </g>
</svg>
