<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Embarquement">
  <!--
    BilletEnLigne — boarding scanner

    108x108 is the Android adaptive-icon canvas. Everything meaningful sits
    inside the centre 66% safe zone (x/y 18..90), so no launcher mask — circle,
    squircle, teardrop — can crop it.

    Near-black ground and a bright mint reticle: deliberately the least
    brand-like icon in the family. A conductor holding a work phone in direct
    sun must not hesitate between this and the passenger app, and colour alone
    would not carry that on a cheap panel — hence the corner brackets, which
    read as "scan" at any size and in greyscale.
  -->
  <rect width="108" height="108" fill="#141A17"/>

  <defs>
    <mask id="notch-scanner">
      <rect width="108" height="108" fill="#fff"/>
      <circle cx="30" cy="54" r="7" fill="#000"/>
      <circle cx="78" cy="54" r="7" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#notch-scanner)">
    <rect x="30" y="34" width="48" height="40" rx="7" fill="#FFFFFF"/>
  </g>

  <line x1="66" y1="39" x2="66" y2="69" stroke="#141A17" stroke-width="2.4"
        stroke-linecap="round" stroke-dasharray="2.4 3.8"/>

  <!-- A check inside the ticket: this app answers one question. -->
  <path d="M42 54 l7.5 7.5 L64 47" fill="none" stroke="#141A17"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Reticle corners. The shape that says "scanner" without colour. -->
  <g stroke="#3FBF8F" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M22 34 V26 h8"/>
    <path d="M86 34 V26 h-8"/>
    <path d="M22 74 v8 h8"/>
    <path d="M86 74 v8 h-8"/>
  </g>
</svg>
