<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Console opérateur">
  <!--
    BilletEnLigne — operator console

    108x108 is the Android adaptive-icon canvas. Everything meaningful sits
    inside the centre 66% safe zone (x/y 18..90), so no launcher mask — circle,
    squircle, teardrop — can crop it.

    Latérite: the roads themselves, and the operator's half of the platform.
    Inside the ticket, a departure board — rows of times, which is what an
    operator actually looks at all day.
  -->
  <rect width="108" height="108" fill="#D9772F"/>

  <defs>
    <mask id="notch-console">
      <rect width="108" height="108" fill="#fff"/>
      <circle cx="30" cy="54" r="7" fill="#000"/>
      <circle cx="78" cy="54" r="7" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#notch-console)">
    <rect x="30" y="34" width="48" height="40" rx="7" fill="#FFFFFF"/>
  </g>

  <line x1="66" y1="39" x2="66" y2="69" stroke="#D9772F" stroke-width="2.4"
        stroke-linecap="round" stroke-dasharray="2.4 3.8"/>

  <!-- A departure board. Rows of times. -->
  <g fill="#D9772F">
    <rect x="39" y="45" width="20" height="3.6" rx="1.8"/>
    <rect x="39" y="52.2" width="14" height="3.6" rx="1.8"/>
    <rect x="39" y="59.4" width="17" height="3.6" rx="1.8"/>
  </g>
</svg>
