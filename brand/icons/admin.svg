<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Back-office">
  <!--
    BilletEnLigne — admin back office

    108x108 is the Android adaptive-icon canvas. Everything meaningful sits
    inside the centre 66% safe zone (x/y 18..90), so no launcher mask — circle,
    squircle, teardrop — can crop it.

    Ardoise slate: restrained on purpose. This is an internal tool behind an IP
    allowlist and mandatory 2FA, not a product anyone markets. Inside the
    ticket, control sliders — the app that sets the rules rather than following
    them.
  -->
  <rect width="108" height="108" fill="#3B4650"/>

  <defs>
    <mask id="notch-admin">
      <rect width="108" height="108" fill="#fff"/>
      <circle cx="30" cy="54" r="7" fill="#000"/>
      <circle cx="78" cy="54" r="7" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#notch-admin)">
    <rect x="30" y="34" width="48" height="40" rx="7" fill="#FFFFFF"/>
  </g>

  <line x1="66" y1="39" x2="66" y2="69" stroke="#3B4650" stroke-width="2.4"
        stroke-linecap="round" stroke-dasharray="2.4 3.8"/>

  <!-- Control sliders. This is the surface that governs the others. -->
  <g stroke="#3B4650" stroke-width="3.4" stroke-linecap="round">
    <line x1="38" y1="47" x2="60" y2="47"/>
    <line x1="38" y1="61" x2="60" y2="61"/>
  </g>
  <g fill="#3B4650">
    <circle cx="53" cy="47" r="5"/>
    <circle cx="44" cy="61" r="5"/>
  </g>
</svg>
