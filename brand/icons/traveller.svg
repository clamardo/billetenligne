<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BilletEnLigne">
  <!--
    BilletEnLigne — traveller app

    108x108 is the Android adaptive-icon canvas. Everything meaningful sits
    inside the centre 66% safe zone (x/y 18..90), so no launcher mask — circle,
    squircle, teardrop — can crop it.

    Forêt green: the primary brand, and the one colour a traveller ever needs
    to recognise on a crowded home screen.
  -->
  <rect width="108" height="108" fill="#0A6B4F"/>

  <defs>
    <mask id="notch-traveller">
      <rect width="108" height="108" fill="#fff"/>
      <circle cx="30" cy="54" r="7" fill="#000"/>
      <circle cx="78" cy="54" r="7" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#notch-traveller)">
    <rect x="30" y="34" width="48" height="40" rx="7" fill="#FFFFFF"/>
  </g>

  <line x1="66" y1="39" x2="66" y2="69" stroke="#0A6B4F" stroke-width="2.4"
        stroke-linecap="round" stroke-dasharray="2.4 3.8"/>

  <!-- The journey. Origin, destination, the road between. -->
  <g stroke="#0A6B4F" fill="#0A6B4F">
    <line x1="41" y1="63" x2="57" y2="45" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="41" cy="63" r="4.6"/>
    <circle cx="57" cy="45" r="4.6"/>
  </g>
</svg>
