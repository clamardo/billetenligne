name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Layers 1 and 2 of ADR-0021. Pure Dart, no containers, no Flutter — so it
  # answers in under a minute and is the signal developers actually wait for.
  domain:
    name: Domain, contracts, layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      # The onion rule. Fails the build, not the review.
      - name: Layer boundaries
        run: dart run tool/check_layers.dart

      - name: Domain, localization, contract and client tests
        run: dart test packages/bel_domain packages/bel_localization packages/bel_contracts packages/bel_crypto packages/bel_client

      - name: API tests
        run: dart test services/api

      # Over a real socket. Header casing and middleware ordering are both
      # invisible to a unit suite that builds its own context.
      - name: API smoke over HTTP
        run: |
          dart pub global activate dart_frog_cli
          ./tool/smoke_api.sh

  # The design system's accessibility gates. Separate job because it needs the
  # Flutter SDK, which is a slower checkout.
  design:
    name: Kilo contrast gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Contrast and accent-hue gates
        working-directory: packages/bel_design
        run: flutter test

      - name: Boarding scanner
        working-directory: apps/scanner
        run: flutter test

      # The bundled catalog is a copy (bel_localization is pure Dart and
      # cannot declare Flutter assets). Sync first, so a stale copy fails the
      # freshness test rather than shipping strings that disagree with the
      # server's.
      - name: Sync the translation catalog
        run: ./tool/sync_i18n.sh

      - name: Traveller app
        working-directory: apps/traveller
        run: flutter test

      # The shared back-office flow: sign-in, the second factor, and enrolling
      # one. Tested here rather than twice over, which is the whole reason it
      # is a package — two implementations of one security control is two
      # chances for one of them to forget the enrolment gate.
      - name: Back-office sign-in
        working-directory: packages/bel_backoffice
        run: flutter test

      # These two ran only under `melos test:apps`, and nothing in this file
      # installs melos — so the console and the back office had widget tests
      # that no pipeline executed. Named explicitly, for the same reason the
      # traveller app is.
      - name: Operator console
        working-directory: apps/console
        run: flutter test

      - name: Back office
        working-directory: apps/admin
        run: flutter test

  # The object store, against real Azurite. Shared Key signing is thirteen
  # lines in a fixed order and the service answers 403 with no hint about
  # which one was wrong — a mock would agree with whatever we wrote. It
  # already caught one: `signedEncryptionScope` belongs to sv=2020-12-06, and
  # including it under 2020-10-02 refused every signature we issued.
  storage:
    name: Object store against Azurite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Blob round trip, cache headers and SAS
        run: ./tool/storage.sh

  # Layer 3. A schema that compiles is not a schema that isolates tenants,
  # balances a ledger or refuses to let someone edit an audit trail — so all
  # three are executed against a real Postgres.
  schema:
    name: Schema guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, RLS, ledger and append-only checks
        run: ./infra/migrations/check.sh

  # The seat race, against the lock manager that will actually arbitrate it.
  # A fake cannot prove that fifty concurrent claims produce one winner —
  # there is no concurrency to lose to — so this job exists to make that one
  # claim honestly.
  integration:
    name: Inventory under concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Holds against a real Postgres
        run: ./tool/integration.sh

  # The two images a deployment actually runs. Building them is not the check
  # — a Dockerfile that compiles and produces an image which exits on its
  # first request is a green build and a broken deploy — so the script starts
  # each one and asks it to do the smallest real thing it does.
  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both, and prove they start
        run: ./tool/images.sh

  # Budgets from ADR-0009, enforced rather than hoped for. Skipped until the
  # traveller app exists.
  budgets:
    name: Size and cold-start budgets
    runs-on: ubuntu-latest
    if: hashFiles('apps/traveller/pubspec.yaml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build per-ABI release APK
        working-directory: apps/traveller
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Assert APK is under 15 MB
        run: |
          apk=$(find apps/traveller/build -name '*arm64*.apk' | head -1)
          size=$(stat -c%s "$apk")
          echo "APK: $((size / 1024 / 1024)) MB"
          # This is the market, not an edge case: users are on Android Go
          # phones buying 500 MB data bundles.
          test "$size" -le $((15 * 1024 * 1024))
