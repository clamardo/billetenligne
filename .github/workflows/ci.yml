name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Layers 1 and 2 of ADR-0021. Pure Dart, no containers, no Flutter — so it
  # answers in under a minute and is the signal developers actually wait for.
  domain:
    name: Domain, contracts, layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      # The onion rule. Fails the build, not the review.
      - name: Layer boundaries
        run: dart run tool/check_layers.dart

      # The iOS projects, checked from a machine that cannot build them. Not a
      # substitute for a Mac — it is the part that does not need one, and
      # several of these are not build failures at all: a missing usage
      # description is a runtime termination with no dialog and no log.
      - name: iOS project
        run: dart run tool/check_ios.dart

      - name: Domain, localization, contract and client tests
        run: >-
          dart test packages/bel_platform packages/bel_domain
          packages/bel_localization packages/bel_contracts packages/bel_crypto
          packages/bel_client

      - name: API tests
        run: dart test services/api

      # Over a real socket. Header casing and middleware ordering are both
      # invisible to a unit suite that builds its own context.
      - name: API smoke over HTTP
        run: |
          dart pub global activate dart_frog_cli
          ./tool/smoke_api.sh

  # The design system's accessibility gates. Separate job because it needs the
  # Flutter SDK, which is a slower checkout.
  design:
    name: Kilo contrast gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Contrast and accent-hue gates
        working-directory: packages/bel_design
        run: flutter test

      - name: Boarding scanner
        working-directory: apps/scanner
        run: flutter test

      # The bundled catalog is a copy (bel_localization is pure Dart and
      # cannot declare Flutter assets). Sync first, so a stale copy fails the
      # freshness test rather than shipping strings that disagree with the
      # server's.
      - name: Sync the translation catalog
        run: ./tool/sync_i18n.sh

      - name: Traveller app
        working-directory: apps/traveller
        run: flutter test

      # The shared back-office flow: sign-in, the second factor, and enrolling
      # one. Tested here rather than twice over, which is the whole reason it
      # is a package — two implementations of one security control is two
      # chances for one of them to forget the enrolment gate.
      - name: Back-office sign-in
        working-directory: packages/bel_backoffice
        run: flutter test

      # These two ran only under `melos test:apps`, and nothing in this file
      # installs melos — so the console and the back office had widget tests
      # that no pipeline executed. Named explicitly, for the same reason the
      # traveller app is.
      - name: Operator console
        working-directory: apps/console
        run: flutter test

      - name: Back office
        working-directory: apps/admin
        run: flutter test

  # The object store, against real Azurite. Shared Key signing is thirteen
  # lines in a fixed order and the service answers 403 with no hint about
  # which one was wrong — a mock would agree with whatever we wrote. It
  # already caught one: `signedEncryptionScope` belongs to sv=2020-12-06, and
  # including it under 2020-10-02 refused every signature we issued.
  storage:
    name: Object store against Azurite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Blob round trip, cache headers and SAS
        run: ./tool/storage.sh

  # Layer 3. A schema that compiles is not a schema that isolates tenants,
  # balances a ledger or refuses to let someone edit an audit trail — so all
  # three are executed against a real Postgres.
  schema:
    name: Schema guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, RLS, ledger and append-only checks
        run: ./infra/migrations/check.sh

  # The seat race, against the lock manager that will actually arbitrate it.
  # A fake cannot prove that fifty concurrent claims produce one winner —
  # there is no concurrency to lose to — so this job exists to make that one
  # claim honestly.
  integration:
    name: Inventory under concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Holds against a real Postgres
        run: ./tool/integration.sh

  # The two images a deployment actually runs. Building them is not the check
  # — a Dockerfile that compiles and produces an image which exits on its
  # first request is a green build and a broken deploy — so the script starts
  # each one and asks it to do the smallest real thing it does.
  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both, and prove they start
        run: ./tool/images.sh

  # The manifests. Not a deploy — nothing here reaches a cluster — but a
  # kustomization that does not render is a deploy that fails at the moment
  # somebody is trying to ship, and it renders in under a second.
  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: kubectl kustomize infra/k8s > /dev/null
      - name: Every placeholder is substituted, none left behind
        run: |
          rendered="$(kubectl kustomize infra/k8s \
            | sed -e 's#REGISTRY/bel-\([a-z]*\):latest#example/bel-\1:tag#g' \
                  -e 's#projects/PROJECT/secrets#projects/example/secrets#g' \
                  -e 's#bel-workload@PROJECT#bel-workload@example#g')"
          # `FIREBASE_PROJECT_ID` is a key name, not a placeholder — the
          # patterns are the exact shapes deploy.sh rewrites.
          if grep -qE 'REGISTRY/|projects/PROJECT/|@PROJECT\.' <<<"$rendered"; then
            echo "a placeholder the deploy script would not rewrite:"
            grep -nE 'REGISTRY/|projects/PROJECT/|@PROJECT\.' <<<"$rendered"
            exit 1
          fi
      # The worker takes pass names as arguments and the schedules name them
      # one at a time, so a pass added to the worker and to neither ScaledJob
      # simply never runs — and nothing anywhere would say so. `alerts-expired`
      # was exactly that on the day the schedules were first written.
      - name: Every worker pass is on a schedule
        run: |
          passes="$(grep -oE "^    '[a-z-]+':" services/worker/bin/worker.dart \
                    | tr -d " ':" | sort -u)"
          scheduled="$(grep -oE '^ +- [a-z-]+$' infra/k8s/worker/scaledjob.yaml \
                       | sed 's/^ *- //' | sort -u)"
          missing="$(comm -23 <(echo "$passes") <(echo "$scheduled"))"
          if [ -n "$missing" ]; then
            echo "worker passes that no ScaledJob runs:"
            echo "$missing"
            exit 1
          fi

      # Three lists of the same secrets, in three languages. A secret the
      # pods mount and the project does not have is a pod that never starts,
      # and the mount is the one place that failure is invisible until a
      # deploy.
      - name: The secrets agree across Kubernetes and Terraform
        run: |
          template="$(grep -oE '^  [A-Z][A-Z0-9_]*:' infra/k8s/secrets.example.yaml \
                      | tr -d ' :' | LC_ALL=C sort)"
          mounted="$(grep -oE '^ +path: "[A-Z0-9_]+"' infra/k8s/secretproviderclass.yaml \
                     | sed -E 's/.*"(.*)"/\1/' | LC_ALL=C sort)"
          declared="$(sed -n '/variable "secret_names"/,/^}/p' terraform/gcp-module/variables.tf \
                      | grep -oE '"[A-Z][A-Z0-9_]*"' | tr -d '"' | LC_ALL=C sort)"
          if [ "$template" != "$mounted" ]; then
            echo "the secret template and the CSI mount disagree:"
            diff <(echo "$template") <(echo "$mounted") || true
            exit 1
          fi
          if [ "$template" != "$declared" ]; then
            echo "the secret template and Terraform disagree:"
            diff <(echo "$template") <(echo "$declared") || true
            exit 1
          fi
          echo "$(echo "$template" | wc -l) secrets, in step"

      # A key in both files is a key whose value comes from whichever is
      # applied second — which is the Secret, silently, and only in the
      # cluster. The split between them is a judgement about what is a secret,
      # and a duplicate means somebody made it twice and differently.
      - name: No key is in both the config map and the secret
        run: |
          both="$(comm -12 \
            <(grep -oE '^  [A-Z][A-Z0-9_]*:' infra/k8s/configmap.yaml | tr -d ' :' | LC_ALL=C sort) \
            <(grep -oE '^  [A-Z][A-Z0-9_]*:' infra/k8s/secrets.example.yaml | tr -d ' :' | LC_ALL=C sort))"
          if [ -n "$both" ]; then
            echo "keys defined in both places:"
            echo "$both"
            exit 1
          fi

      # Three promises the manifests make that are invisible in a render and
      # expensive to discover on a cluster. Each one shipped broken.
      - name: Nothing runs as the default service account
        # Workload Identity is on, which takes the node service account away
        # from the pods: anything on `default` has no Google credentials at
        # all, and finds out in the metadata server months later.
        run: |
          rendered="$(kubectl kustomize infra/k8s)"
          pods="$(grep -c 'restartPolicy: Never\|      containers:' <<<"$rendered" || true)"
          named="$(grep -c 'serviceAccountName: bel' <<<"$rendered" || true)"
          echo "$named pod templates name the service account"
          if [ "$named" -lt 5 ]; then
            echo "a workload without serviceAccountName: bel"
            exit 1
          fi

      - name: Every deployment has a disruption budget
        # `maxUnavailable: 0` protects a rollout. A node drain is not a
        # rollout, and it is what actually takes a replica away.
        run: |
          rendered="$(kubectl kustomize infra/k8s)"
          for app in bel-api bel-console bel-admin; do
            if ! awk '/^kind: PodDisruptionBudget/,/^---/' <<<"$rendered" \
                 | grep -q "app: $app"; then
              echo "$app has no PodDisruptionBudget"
              exit 1
            fi
          done

      - name: Every container states what it needs and what it may take
        run: |
          rendered="$(kubectl kustomize infra/k8s)"
          # Indentation varies with the kind, so count the thing that is the
          # same everywhere: one image reference per container.
          containers="$(grep -c 'image: REGISTRY/bel-' <<<"$rendered" || true)"
          requests="$(grep -cE '^ +requests:$' <<<"$rendered" || true)"
          limits="$(grep -cE '^ +limits:$' <<<"$rendered" || true)"
          echo "$containers containers, $requests requests, $limits limits"
          if [ "$requests" -lt "$containers" ] || [ "$limits" -lt "$containers" ]; then
            echo "a container with no resource requests or no limits"
            exit 1
          fi

      - name: No secret has a value in it
        # `secrets.example.yaml` is a template and is not in the
        # kustomization. This is the check that keeps it a template.
        run: |
          if grep -nE '^\s+[A-Z_]+: +.+' infra/k8s/secrets.example.yaml \
             | grep -v ': *""' | grep -q .; then
            echo "a value in the secret template:"
            grep -nE '^\s+[A-Z_]+: +.+' infra/k8s/secrets.example.yaml | grep -v ': *""'
            exit 1
          fi

  # The file somebody installs. A release APK is not a debug build with a flag
  # flipped: a different manifest merge, a different signing certificate, and
  # the `--dart-define`s compiled in and unchangeable. All three have been
  # wrong here, so the artifacts are opened and interrogated rather than
  # counted.
  android:
    name: Android release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # A key generated here and thrown away with the runner. It exists so the
      # signing checks have something to check; the real upload key is not in
      # this repository and never will be.
      - name: A throwaway upload key
        run: ./tool/release_android.sh --keystore
      - name: Build and interrogate
        env:
          BEL_API_URL: https://blt.cg
          BEL_FIREBASE_API_KEY: ci-placeholder
        run: ./tool/release_android.sh

  # The infrastructure, checked the only way it can be without applying it.
  # `validate` catches a misspelled resource, a wrong argument name and a
  # provider version that no longer has the field being set — which is most of
  # what goes wrong between one apply and the next, six months apart.
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Formatting
        run: terraform fmt -recursive -check -diff terraform
      # The live modules read a gitignored credentials file. The sample next
      # to it has the same shape and no real values, which is what makes this
      # runnable at all.
      - name: A credentials file with nothing in it
        run: cp terraform/credentials-prod.sample.json terraform/credentials-prod.json
      - name: Validate
        run: |
          for dir in terraform/gcp-module terraform/azure-module \
                     terraform/live-module-gcp/prod terraform/live-module-azure/prod; do
            echo "── $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

  # Budgets from ADR-0009, enforced rather than hoped for. Skipped until the
  # traveller app exists.
  budgets:
    name: Size and cold-start budgets
    runs-on: ubuntu-latest
    if: hashFiles('apps/traveller/pubspec.yaml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build per-ABI release APK
        working-directory: apps/traveller
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Assert APK is under 15 MB
        run: |
          apk=$(find apps/traveller/build -name '*arm64*.apk' | head -1)
          size=$(stat -c%s "$apk")
          echo "APK: $((size / 1024 / 1024)) MB"
          # This is the market, not an edge case: users are on Android Go
          # phones buying 500 MB data bundles.
          test "$size" -le $((15 * 1024 * 1024))
