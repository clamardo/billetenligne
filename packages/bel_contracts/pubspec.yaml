name: bel_contracts
description: >-
  The wire format, defined once. Serialised by the Dart Frog API, parsed by
  every client. Adding a field is one edit here and both ends fail to compile
  until updated — which is the good kind of breakage (ADR-0004).
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
dependencies:
  bel_domain: ^0.1.0
  bel_platform: ^0.1.0
dev_dependencies:
  test: ^1.25.0
