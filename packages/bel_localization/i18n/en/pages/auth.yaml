# The sign-in screen. It appears at the moment of holding a seat, never at
# launch: letting someone see the value before asking for an identity is what
# avoids the most expensive drop-off in this funnel (ADR-0013).
auth:
  gate:
    title: "Almost yours"
    intro: "We need an address to send your ticket to."
    reassurance: "No password. A one-time code, and that is all."
  email:
    label: "Email address"
    hint: "you@example.cg"
    submit: "Send me a code"
  phone:
    label: "Phone number"
    hint: "06 123 45 67"
    submit: "Send me a code by SMS"
    unavailable: "SMS delivery is coming soon. Use your email for now."
  code:
    title: "Enter the code"
    sentTo: "Code sent to {destination}."
    label: "6-digit code"
    submit: "Sign in"
    resend: "Send it again"
    resendIn: "Send again in {seconds}s"
    expiresIn: "This code expires in {minutes} min."
    wrongAddress: "Not the right address?"
  signedIn:
    welcome: "Welcome."
    welcomeBack: "Good to see you again."
  mfa:
    title: "Two-step verification"
    intro: "Open your authenticator app and enter the code it shows."
    label: "6-digit code"
    submit: "Verify"
    useRecovery: "Use a recovery code"
    useCode: "Use the app instead"
    recoveryLabel: "Recovery code"
    recoveryHint: "ABCDE-12345"
  enrol:
    title: "Protect your access"
    why: "This account can commit money that is not yours. An authenticator app is required."
    step1: "1. Install an authenticator app (Google Authenticator, Authy, 1Password…)."
    step2: "2. Add an account manually and paste this key:"
    step3: "3. Enter the 6-digit code it shows."
    secretLabel: "Setup key"
    copied: "Key copied."
    confirm: "Finish setup"
    recoveryTitle: "Your recovery codes"
    recoveryIntro: "Write them down now. They are never shown again, and each one works once."
    recoveryKept: "I have written them down"
    done: "Authenticator app enabled."
    remaining: "{count} recovery code(s) left."
    disable: "Remove the authenticator app"
    manage: "Two-step verification"
  signOut: "Sign out"
