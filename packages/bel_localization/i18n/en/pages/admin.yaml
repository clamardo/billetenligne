  # The weekly payout (04-payments.md §6.2). The whole statement is in the
  # row: the person approving is agreeing to a number, and they should be able
  # to check it without navigating anywhere.
  payouts:
    title: "Payouts"
    subtitle: "{count} waiting · oldest first"
    emptyTitle: "Nothing waiting"
    emptyBody: "Prepare a statement for one operator and one period, then a second person approves it."
    period: "{from} to {to}"
    online: "Online sales"
    cash: "Counter sales (cash)"
    tickets: "{count} ticket(s) · {amount}"
    commission: "Commission"
    refunds: "Refunds issued"
    payable: "Balance owed"
    tills: "Cash in drawers (deducted)"
    destination: "Paid to"
    secondPerson: "You cannot approve a statement you prepared."
    approve: "Approve this statement"
    release: "Send the money"
    reference: "Transfer reference"
    referenceHint: "The one that will appear on the bank statement. Without it, nobody can find this transfer."
    owesUs: "This operator owes us {amount}. No transfer: an invoice and a conversation."
    state:
      draft: "Prepared"
      approved: "Approved"
      paid: "Paid"
      void: "Voided"
  # Where people leave (04-payments.md §8). The screen says what it cannot
  # measure before it says anything else: a search leaves no row, so the first
  # figure is a seat held, not a search run.
  funnel:
    title: "Where people leave"
    countsFrom: "Counting starts at the held seat. Searches are not recorded anywhere, so nothing here says how many people looked without booking."
    days: "{n} days"
    rate: "{rate}%"
    quiet: "Nothing that day"
    held: "Seats held"
    reserved: "Booked"
    paid: "Paid"
    lost: "{lapsed} seat(s) released · {failed} payment(s) refused"
    drop: "Conversion fell {points} points day on day. A payment rail or the funnel itself is broken."
    emptyTitle: "No seats held in this window"
    emptyBody: "Nobody started a booking on these days — or the window predates launch."
  notice:
    decision: "{a1} · decision recorded"
    commission: "Commission set to {a1}"
    reasked: "Asked the rail again. The payment stays in limbo until it answers."
    captured: "Payment captured. Ticket issued."
    failed: "Payment declared failed. The seat is back on sale."
    payout.prepared: "Statement prepared: {a1}. A second person must approve it."
    payout.approved: "Statement approved: {a1}. The money has not gone yet."
    payout.released: "{a1} sent. Reference {a2}."
    payout.needsReference: "Enter the transfer reference before sending."
  # The Compliance screen (03-operator-lifecycle.md §6). A calendar, not a
  # queue: nothing here arrived because somebody submitted it, and the
  # deadline lands whether or not this tab was opened — the worker stops the
  # sales on its own. What this screen is for is the fortnight before that.
  compliance:
    title: "Compliance"
    subtitle: "{count} operator(s) with a document coming due."
    window: "{days} days"
    open: "Open the file"
    blocked: "Sales stopped: {document} expired."
    remainingDays: "in {days} d"
    lapsedDays: "expired {days} d ago"
    emptyTitle: "Nothing to chase"
    emptyBody: "No document falls due inside this window. Widen it to look further ahead."
