    nameRequired: "Give each passenger's name"
    submit: "Reserve — {total}"
  tickets:
    title: "My tickets"
    open: "My tickets"
    loading: "Loading your tickets…"
    upcoming: "Upcoming"
    past: "Past trips"
    emptyTitle: "No tickets yet"
    emptyBody: "Your tickets appear here as soon as a payment is confirmed."
    emptyAction: "Find a departure"
