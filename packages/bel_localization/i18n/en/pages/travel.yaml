# The traveller journey: welcome, search, results, seat map, hold.
# Translated from the French source. Keep sentences short — they are read in
# direct sun, on a scratched screen, by somebody in a hurry.
travel:
  onboarding:
    welcomeTitle: "Your seat, reserved in advance"
    welcomeBody: "Choose your operator, your departure and your seat. Pay with Mobile Money. Show your ticket at the door."
    seatTitle: "A seat that is yours"
    seatBody: "You see the coach layout and you choose. No more standing at the door hoping."
    ticketTitle: "Your ticket, even with no signal"
    ticketBody: "The QR code works offline. You can print it too."
    chooseLanguage: "Choose your language"
    start: "Get started"
  search:
    title: "Where are you going?"
    swap: "Swap"
    today: "Today"
    tomorrow: "Tomorrow"
    pickDate: "Pick a date"
    passengersLabel:
      one: "{count} traveller"
      other: "{count} travellers"
    chooseBoth: "Choose a departure and an arrival"
    submit: "Find a departure"
    sameCity: "Departure and arrival must be different."
    chooseOrigin: "Choose a departure city"
    chooseDestination: "Choose an arrival city"
  results:
    title: "{from} → {to}"
    subtitle: "{date} · {count} departures"
    subtitleMore: "{date} · {count} departures and more"
    searching: "Looking for departures…"
    emptyTitle: "No departures that day"
    emptyBody: "Try the next day, or another operator."
    tryTomorrow: "See tomorrow"
    priceFrom: "from {amount}"
    soldOut: "Sold out"
    scarce: "Almost full"
    # 08-disruption.md §6. Shown only when the server sends a figure: with too
    # little history behind it, nothing at all.
    onTime: "{rate}% on time"
    offlineTitle: "No signal"
    offlineBody: "The times below are from your last connection."
  seatmap:
    title: "Choose your seat"
    front: "FRONT"
    free: "Free"
    chosen: "Chosen"
    taken: "Taken"
    selectedCount:
      one: "{count} seat chosen"
      other: "{count} seats chosen"
    chooseAtLeastOne: "Choose at least one seat"
    maxReached: "You can reserve at most {max} seats."
    continueWith: "Continue · {amount}"
    availabilityNote: "Seats are taken and released in real time. A seat is yours only once reserved."
    loading: "Loading the coach layout…"
  hold:
    title: "Your seat is reserved"
    body: "Pay before the countdown ends to confirm your ticket."
    countdown: "Seat reserved · {time}"
    expiringSoon: "{minutes} min left to pay"
    expiredTitle: "Your reservation expired"
    expiredBody: "The seat went back on sale. You can start again."
    release: "Cancel the reservation"
    releasing: "Cancelling…"
    proceed: "Pay {amount}"
    paymentComingSoon: "Mobile Money payment is coming shortly. Your seat stays reserved until the countdown ends."
    seatsLabel: "Seats {seats}"
  passengers:
    title: "Who is travelling?"
    intro: "The name is what the conductor checks. The number receives the ticket by SMS."
    forSeat: "Seat {seat}"
    phoneOptional: "Phone (optional)"
    phoneHelp: "The ticket goes to this number, not to yours."
    nameRequired: "Give each passenger's name"
    submit: "Reserve — {total}"
  tickets:
    title: "My tickets"
    open: "My tickets"
    loading: "Loading your tickets…"
    upcoming: "Upcoming"
    past: "Past trips"
    emptyTitle: "No tickets yet"
    emptyBody: "Your tickets appear here as soon as a payment is confirmed."
    emptyAction: "Find a departure"
    staleTitle: "No network"
    staleBody: "These tickets are from your last connection. They are still valid: the QR code works offline."
    unpaid: "To pay"
    unpaidHint: "Code {code} · pay before {time}"
    cancelled: "Cancelled"
    voided: "Void"
    seatsLabel:
      one: "{count} seat"
      other: "{count} seats"
    departsOn: "{date} · {time}"
    show: "Show ticket"
  ticket:
    title: "Ticket"
    seatOf: "Ticket {index} of {total}"
    nextPassenger: "Next passenger"
    showToConductor: "Show this code to the conductor"
    passenger: "Passenger"
    codeLabel: "Check code"
    codeHelp: "It changes every 30 seconds. Show the screen, not a screenshot."
    offlineNote: "This ticket works with no network. You can turn your data off."
    voidedTitle: "Ticket void"
    voidedBody: "This ticket was refunded or cancelled. It no longer boards."
    boardBy: "Board by {time}"
    arrivesAtStation: "Arrives at {station}"
    # During a disruption this ticket IS the information channel
    # (08-disruption.md §3.3): what the operator declared, where, and what it
    # entitles the passenger to — above everything else on the screen.
    disrupted: "{kind} reported by {operator}"
    disruptedAt: "Near {place}"
    disruptedNewTime: "Now departing at {time}"
    disruptedFree: "No fees: exchange or full refund."
    disruptedCounter: "Go to a {operator} counter, or call the agency."
  # The passenger's choice screen (08-disruption.md §3.2). Three rules hold
  # here: one option is already assigned — nobody is left with nothing while
  # they think —, every row states the ARRIVAL time, and the refund is always
  # there, last, never hidden.
  choice:
    open: "See your options"
    title: "Your trip is disrupted"
    loading: "Loading your options…"
    trip: "{origin} → {destination} · {date} · {time}"
    at: "Breakdown near {place}"
    lead: "Choose — at no cost:"
    assigned: "ASSIGNED"
    keep: "Keep this"
    pick: "Choose"
    departsAt: "Departs {time}"
    arrives: "Arrives {time}"
    seat: "seat {seats}"
    seats:
      one: "{count} seat"
      other: "{count} seats"
    partial: "{covered} of {needed} seats"
    full: "Full"
    otherOperator: "Another company"
    refundTitle: "Full refund"
    refundBody: "{amount}, collected at the counter"
    fallback: "With no answer before {time}, we keep you on the assigned seat."
    closed: "The window for choosing has passed. Please see the company's counter."
    keptTitle: "You keep your seat"
    keptBody: "Nothing changes. Your ticket stays valid."
    movedTitle: "You have been moved"
    movedBody: "Departs {time} · {seats}"
    movedTicket: "Your new ticket is ready. The old one no longer boards."
    refundedTitle: "Refund recorded"
    refundedBody: "{amount} will be handed to you at the company's counter."
    claimCode: "Collection code"
    claimHelp: "Write it down. It is also sent to you by SMS."
    done: "Back to my tickets"
  # Sharing a trip (ADR-0014 §2). The use case is specific and very common
  # here: a relative travelling the 512 km of the RN1, and somebody at the far
  # end deciding when to leave for the station. Today that costs phone credit
  # and repeated calls.
  share:
    action: "Share my trip"
    title: "Share my trip"
    lead: "{origin} → {destination}, {date}. Send a link to somebody waiting for you."
    whatTheySee: "What they will see"
    seeRoute: "The route, the company and the times"
    seeProgress: "How far along the coach is, with how sure we are"
    seeDisruption: "A delay or a breakdown, as soon as the company reports it"
    neverSee: "Never your seat, the price you paid, or your number. This page follows a coach, not a person."
    create: "Create the link"
    linkLabel: "Link to share"
    linkHidden: "A link already exists — create a new one if you have lost it."
    opens:
      one: "{count} person has opened this link"
      other: "{count} people have opened this link"
    expires: "The link stops working on {date} at {time}"
    revoke: "Withdraw the link"
    revokeHint: "The link stops working immediately. You can always create another."
  # The traveller cancelling for themselves (01-feature-spec.md §8.2). Three
  # questions in order: what am I cancelling, what do I get back, and where.
  # The word "refund" never appears when nothing was paid — an unpaid
  # reservation is released, not refunded.
  cancel:
    action: "Cancel this trip"
    title: "Cancel this trip"
    lead: "{origin} → {destination}, {date}"
    seats:
      one: "{count} seat"
      other: "{count} seats"
    releaseTitle: "Nothing was paid"
    releaseBody: "This booking was never paid for. Cancelling frees the seat and costs you nothing."
    releaseConfirm: "Cancel the booking"
    releaseDone: "Booking cancelled. The seat is back on sale."
    refundTitle: "What you get back"
    paid: "Paid"
    refundable: "Refunded"
    retained: "Retained"
    # Said in words rather than shown as "0 FCFA": a zero beside a confirm
    # button is read by nobody.
    nothingBack: "The terms this ticket was sold under no longer provide a refund at this point. Cancelling frees the seat but returns nothing."
    atCounter: "You will get a code to show at any {operator} agency."
    toSource: "The money goes back to the payment method you used, within {hours} hours. We will tell you when it arrives."
    terms: "Terms of sale"
    confirm: "Confirm cancellation"
    keep: "Keep my ticket"
    irreversible: "Cancelling cannot be undone. The seat goes back on sale immediately."
    doneTitle: "Trip cancelled"
    doneClaim: "Collect {amount} at any {operator} agency with this code"
    doneClaimExpires: "Code valid until {date}"
    donePending: "{amount} will be refunded within {hours} hours to the payment method you used."
    doneNothing: "The seat has been freed. Nothing is owed to you under the terms of sale."
    doneSms: "We are sending this to you by SMS as well."
    close: "Close"
  # Changing departure (01-feature-spec.md §8.1). Every row carries its price
  # before selection: somebody scanning a list is comparing prices, and a
  # screen that prices only the row you tapped makes them tap five times.
  change:
    action: "Change my departure"
    title: "Change departure"
    lead: "{origin} → {destination}. You are on the {time} on {date}."
    seats:
      one: "{count} seat"
      other: "{count} seats"
    free: "Free"
    plus: "+ {amount}"
    feeLine: "including {amount} change fee"
    seatsLeft:
      one: "{count} seat left"
      other: "{count} seats left"
    arrives: "Arrives {time}"
    # Said before selection, never after: a cheaper departure gives nothing back.
    cheaperKeepsFare: "A cheaper departure does not change the fare you paid."
    involuntary: "The operator changed your departure, so any change is free."
    # The amount goes on the button, not only above it: people read the
    # figure on the thing they press.
    pay: "Pay {amount}"
    payAtAgency: "Payable at an agency"
    heldFor: "Seats held for {minutes} min while you pay."
    # A change already waiting to be paid for. Above the list: without this
    # card the seats stay held for a quarter of an hour with nothing saying
    # so, and the only way out was to wait.
    pendingTitle: "Change waiting to be paid for"
    pending: "Seats held on the {time} departure on {date}. Still to pay: {amount}."
    pendingUntil: "Held until {time}."
    pendingPay: "Pay"
    pendingCancel: "Cancel this change"
    terms: "Change terms"
    none: "No other departure from this operator on this route in the next seven days."
    confirm: "Take this departure"
    doneTitle: "Departure changed"
    doneBody: "You are on the {time} on {date}."
    doneSeats: "New seats: {seats}"
    doneTicket: "Your ticket has been reissued. The old one no longer works."
    close: "See my ticket"
  reserved:
    title: "Reservation confirmed"
    payAtAgency: "Show this code at any {operator} agency to pay."
    codeLabel: "Payment code"
    reference: "Reference"
    route: "Route"
    departure: "Departure"
    seats: "Seats"
    fare: "Seats"
    serviceFee: "Service fee"
    total: "Total to pay"
    deadline: "Pay before {time}, or the seats go back on sale."
    afterPayment: "Once paid, your ticket appears here with its QR code."
    payNow: "Pay now with mobile money"
    payLater: "Pay at an agency"
