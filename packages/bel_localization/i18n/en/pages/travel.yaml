      other: "{count} travellers"
    chooseBoth: "Choose a departure and an arrival"
    submit: "Find a departure"
    sameCity: "Departure and arrival must be different."
    chooseOrigin: "Choose a departure city"
    chooseDestination: "Choose an arrival city"
  results:
    title: "{from} → {to}"
    subtitle: "{date} · {count} departures"
    searching: "Looking for departures…"
