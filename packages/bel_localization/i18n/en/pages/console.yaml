# The operator console. Tables and forms, in an agency's vocabulary rather
# than a database's — "departure" not "materialisation", "coach" not
# "vehicle".
console:
  # The compliance banner (03-operator-lifecycle.md §3.3). It appears at
  # thirty days and cannot be dismissed: it is not about work that just
  # finished, but about a date after which sales stop.
  compliance:
    expiring: "Your {document} expires in {days} day(s). Upload the renewed copy in the console — after that date, new ticket sales stop automatically."
    blocked: "Your {document} has expired. New ticket sales are stopped. Tickets already sold stay valid and your departures run — upload the renewed copy to start selling again."
    suspended: "Account suspended: {document} expired more than a week ago. Departures already sold still run. Upload the document and contact us to be reinstated."
  nav:
    today: "Today"
    counter: "Counter"
    fleet: "Fleet"
    network: "Routes"
    timetable: "Timetables"
    policies: "Terms"
    vitrine: "Storefront"
    finance: "Payouts"
    protection: "Agreements"
  signIn:
    title: "Operator console"
  today:
    title: "Today's departures"
    previous: "Previous day"
    next: "Next day"
    sold: "Sold"
    held: "Held"
    free: "Free"
    manifest: "Manifest"
    noVehicle: "No coach assigned"
    emptyTitle: "No departures on this day"
    emptyBody: "Publish a timetable from the Timetables tab to put departures on sale."
    declare: "Report an incident"
    rescue: "Rescue coach"
    rebook: "Move passengers"
    protect: "Ask another company"
  # The dispatcher's form: at a roadside, on a phone, on 2G, possibly in the
  # rain (08-disruption.md §2.1). Four large targets, a cause, and nothing
  # else required.
  disruption:
    title: "What happened?"
    cause: "Cause"
    note: "Note (optional)"
    noteHint: "Passengers see this alongside the templated message."
    later: "New departure time"
    plus30: "+30 min"
    plus60: "+1 h"
    plus120: "+2 h"
    plus240: "+4 h"
    back: "Back"
    confirm: "Report"
    willTell: "{count} passenger(s) will be told immediately."
    free: "Exchange or full refund, no fees."
    notFree: "Under an hour late: no automatic refund."
    needsTime: "Choose the new departure time."
    badge: "Disrupted"
  # The rescue coach (08-disruption.md §2.2, option ①). The dispatcher picks a
  # coach that actually exists, and the seat count is said before the choice.
  rescue:
    title: "Replace {vehicle}"
    none: "No coach available. Take the passengers to the counter to be rebooked."
    seats: "{count} seats"
    short: "{count} seats short"
    note: "Note (optional)"
    noteHint: "Passengers see this alongside the templated message."
    willMove: "{count} passenger(s) will get a new ticket and a new seat."
    back: "Back"
    confirm: "Send this coach"
  # Moving onto another departure (08-disruption.md §2.2, option ②).
  # Coverage is shown per candidate: "18 of 42" is the number a dispatcher
  # acts on next.
  rebook:
    title: "Move {count} passenger(s)"
    none: "No other departure on this route today. Try a rescue coach."
    covers: "{covered} of {total}"
    note: "Note (optional)"
    noteHint: "Passengers see this alongside the templated message."
    back: "Back"
    confirm: "Move them"
  # The weekly statement, operator side (04-payments.md §6.2). Read-only: the
  # party being paid does not move the row that pays them.
  statements:
    title: "Your payouts"
    subtitle: "One statement per period. Counter sales appear on it and are never paid out."
    emptyTitle: "No statements yet"
    emptyBody: "Your first statement appears here after the first selling period."
    period: "{from} to {to}"
    paidLabel: "Net to pay"
    owed: "You owe us this amount"
    online: "Online sales"
    cash: "Counter sales (cash)"
    tickets: "{count} ticket(s) · {amount}"
    cashNote: "Cash sales are never paid out: you are already holding that money. Only the service fees are deducted."
    commission: "Commission"
    refunds: "Refunds issued"
    tills: "Cash in drawers (deducted)"
    paidOn: "Paid"
    paidWith: "{date} · reference {reference}"
    download: "Download statement (PDF)"
    state:
      draft: "Prepared"
      approved: "Approved"
      paid: "Paid"
      void: "Voided"
  # Inter-operator protection agreements (08-disruption.md §5). What already
  # happens on the forecourt, written down once: the dispatcher looking for a
  # competitor with room at 05:00 is not negotiating a rate in the rain.
  protection:
    title: "Protection agreements"
    subtitle: "Who you can put your passengers on when a coach fails — and at what price, decided in advance."
    emptyTitle: "No agreements yet"
    emptyBody: "An agreement is negotiated once and used the day a coach fails. Without one there is still the rescue coach and your own later departures."
    propose: "Propose an agreement"
    send: "Send proposal"
    awaitingUs: "Waiting for your answer"
    counterparty: "Company code"
    counterpartyHelp: "The code you see on their tickets — \"TBV\"."
    corridors: "Roads covered"
    noRoutes: "Create a route first: an agreement covers journeys."
    discount: "Discount (%)"
    discountHelp: "Off the public fare of whoever does the rescuing."
    cap: "Monthly ceiling"
    capHelp: "Seats per month. Leave empty for no ceiling."
    capValue: "{used} of {cap} seats this month"
    reciprocal: "Reciprocal"
    reciprocalHelp: "Either company may call on the other."
    rebill: "Rebilled at"
    rebillValue: "− {percent}% · {amount} on a {fare} ticket"
    direction: "Direction"
    bothWays: "Both ways"
    oneWay: "One way only"
    theyProposed: "{name} is waiting for your answer."
    weProposed: "Proposed to {name}. Nothing is covered until they accept."
    accept: "Accept"
    decline: "Decline"
    suspend: "Suspend"
    resume: "Resume"
    end: "End"
    state:
      proposed: "Proposed"
      active: "In force"
      suspended: "Suspended"
      ended: "Ended"
  # Asking another company for room (08-disruption.md §2.2, option ③).
  # Nothing moves when it is sent: the request lands on their console and
  # waits for a person. Said twice, because a dispatcher who believes their
  # passengers are placed stops looking for a coach.
  protectionAsk:
    title: "Place {count} passenger(s) with another company"
    none: "No company with an agreement in force has room on this road today."
    seats: "{count} seats free"
    covers: "{covered} of {total}"
