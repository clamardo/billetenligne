# The ticket page (ADR-0026): a web page opened by somebody who bought at a
# counter, does not have the app, and is standing at the coach door. It is
# rendered entirely by the server, QR included — a second network round trip
# at that spot is a second chance to fail.
boardingPass:
  title: "Your ticket"
  headline: "{origin} → {destination}"
  operator: "with {operator}"
  reference: "Reference"
  departure: "Departure"
  arrival: "Arrival"
  station: "Boarding terminal"
  seat: "Seat {seat}"
  passenger: "Passenger"
  instructions: "Show this code to the conductor. Each seat boards exactly once."
  offline: "Keep the message you were sent: the ticket is in it too. This page needs a connection."
  voided: "This ticket was cancelled — it does not board."
  cancelled: "This departure was cancelled by the company."
  expires: "This link works until {date}."
  gone: "This link no longer works"
  goneBody: "It was withdrawn, or the trip is over. Ask the agency that sold you the ticket for a new one."
  cta: "Find your trips in the BilletEnLigne app"

# The ticket on paper. The counter sale — cash, no app, no smartphone — is
# the most common way a seat is bought in this market, and it ends with
# something in the customer's hand that scans exactly like a phone does.
printedTicket:
  title: "Ticket BEL-{ref}"
  kind: "Coach ticket"
  lead: "{count} ticket(s), laid out for {format}."
  print: "Print"
  switchToA4: "Print one per A4 page instead"
  switchToPass: "Print three passes per page instead"
  passenger: "Passenger"
  seat: "Seat"
  reference: "Reference"
  station: "Boarding terminal"
  beEarly: "Be at the terminal 30 minutes before departure."
  voided: "Cancelled — does not board."
