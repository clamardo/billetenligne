# Domain enum labels. Rendered via `translator.enumLabel(...)`, which keeps a
# switch over states out of every surface.
enum:
  PaymentState:
    created: "Created"
    pending: "Pending"
    authorized: "Authorised"
    captured: "Paid"
    failed: "Failed"
    expired: "Expired"
    cancelled: "Cancelled"
    indeterminate: "Verifying"
  MobileOperator:
    airtel: "Airtel Money"
    mtn: "MTN MoMo"
    orange: "Orange Money"
    unknown: "Unknown operator"
  TransportMode:
    bus: "Coach"
    air: "Flight"
  RefundDestination:
    source: "To your original payment method"
    agencyCash: "In cash, at the agency"
    creditNote: "Credit for a future trip"
    travellerChoice: "Traveller's choice"
  DisruptionKind:
    delay: "Delay"
    cancellation: "Cancellation"
    breakdownEnRoute: "Breakdown en route"
    equipmentSwap: "Vehicle change"
    diversion: "Diversion"
    routeSuspension: "Route suspended"
  VerificationResult:
    valid: "VALID"
    alreadyBoarded: "ALREADY BOARDED"
    wrongDeparture: "WRONG DEPARTURE"
    invalid: "INVALID"
    staleCode: "STALE CODE"
    voided: "TICKET VOIDED"
    notOnManifest: "NOT ON MANIFEST"
  OperatorRole:
    orgOwner: "Director"
    orgAdmin: "Administrator"
    finance: "Finance manager"
    fleetManager: "Fleet manager"
    dispatcher: "Dispatcher"
    stationManager: "Station manager"
    vendor: "Ticket agent"
    conductor: "Conductor"
    viewer: "Viewer"
  # What compliance watches (03-operator-lifecycle.md §3.3). `doc_type` is free
  # text in the database, so an unknown key falls back to its own value rather
  # than to a blank.
  # The rungs of the expiry ladder (03-operator-lifecycle.md §3.3).
  ExpiryStage:
    clear: "Up to date"
    noticed: "Due in 2 months"
    warned: "Due in 1 month"
    urgent: "Final week"
    blocked: "Sales stopped"
    suspended: "Suspended"
  # The three bands of the automatic sort (03-operator-lifecycle.md §2.3).
  RiskBand:
    low: "Automatic"
    standard: "To review"
    elevated: "Needs a look"
  DocumentType:
    transport_licence: "transport operating licence"
    fleet_insurance: "fleet insurance certificate"
    technical_inspection: "technical inspection certificate"
    rccm: "trade register entry"
    tax_id: "tax identifier"
seat:
  class:
    standard: "Standard"
    vip: "VIP"
    first: "First"
    economy: "Economy"

# The sentences of a refund policy, generated from the numbers the operator
# entered (ADR-0015 rule 3): operators never write the prose, they answer
# questions. Encoded `key|arg`, rendered a1, a2.
policy:
  line:
    noRefund: "No refund on cancellation."
    tierFull: "Up to {a1} h before departure: refunded in full."
    tier: "Up to {a1} h before departure: {a2}% refunded."
    tierWithFee: "Up to {a1} h before departure: {a2}% refunded, less {a3} in fees."
    after: "Less than {a1} h before departure: no refund."
    window: "Refunded within {a1} h."
    feeKept: "The service fee is not refunded."
    feeRefunded: "The service fee is refunded as well."
    nonRefundable: "Non-refundable fares: {a1}."
    platformFloor: "If the carrier cancels or breaks down, you are refunded in full, whatever the terms say."
    destination:
      source: "Refunded to your payment method."
      agencyCash: "Refunded in cash, at the agency, in person."
      creditNote: "Refunded as credit for a future trip."
      travellerChoice: "You choose how to be refunded."
  # The terms for changing departure (ADR-0012 D-08). Same rule: the operator
  # gives three numbers, we write the sentences.
  change:
    free: "Free changes up to {a1} h before departure."
    fee: "Between {a1} h and {a2} h before departure: {a3} % of the fare paid."
    noFee: "Between {a1} h and {a2} h before departure: changes are free."
    cutoff: "Less than {a1} h before departure: no changes."
    involuntaryFree: "If the operator changes or cancels your departure, changing is free, whatever the terms say."
  # The traveller who missed their coach. Two numbers, and "nothing" is a
  # real answer: honouring a missed ticket is a commercial promise, not a
  # platform behaviour.
  missed:
    notOffered: "A ticket not used at departure is not carried over."
    free: "Missed coach: free transfer to a departure within {a1} h."
    fee: "Missed coach: transfer within {a1} h, for {a2}% of the fare paid."

# A carrier's onboarding application (03-operator-lifecycle.md §2.2). The
# domain returns FIELD NAMES — `rccmNumber`, `ownerPhone` — never sentences:
# it is the one list behind both the applicant's progress bar and the
# reviewer's checklist, and two implementations of "what is missing" always
# drift apart.
application:
  step:
    entreprise: "Company"
    dirigeant: "Owner"
    licences: "Licences"
    exploitation: "Operations"
    encaissement: "Settlement"
    accord: "Agreement"
  field:
    legalName: "Legal name"
    tradingName: "Trading name"
    rccmNumber: "RCCM number (commercial register)"
    taxId: "NIU number (tax identifier)"
    legalForm: "Legal form"
    registeredAddress: "Registered address"
    yearFounded: "Year founded"
    ownerName: "Owner's full name"
    ownerIdType: "ID document type"
    ownerIdNumber: "ID document number"
    ownerPhone: "Owner's phone"
    ownerEmail: "Owner's email"
    transportLicenceNumber: "Transport licence number"
    transportLicenceExpires: "Licence expires"
    insurerName: "Fleet insurer"
    fleetInsuranceExpires: "Insurance expires"
    routesServed: "Routes served"
    fleetSize: "Coaches"
    stationCount: "Agencies"
    dailyDepartures: "Departures per day"
    settlementKind: "Settlement account type"
    settlementAccountName: "Account holder name"
    settlementAccountRef: "Account or wallet number"
    agreement: "Terms accepted"

# Disruptions (08-disruption.md). The label and the cause travel as keys and
# never as prose: the server sends `disruption.kind.delay` and the client
# renders the sentence in the reader's own language (ADR-0008).
disruption:
  kind:
    delay: "Delay"
    cancellation: "Cancellation"
    breakdownEnRoute: "Breakdown en route"
    equipmentSwap: "Coach change"
    diversion: "Diversion"
    routeSuspension: "Route suspended"
  cause:
    mechanical: "Mechanical failure"
    roadClosed: "Road closed"
    weather: "Weather"
    security: "Security"
    noDriver: "No driver"
    noVehicle: "No coach available"
    checkpoint: "Checkpoint"
    lateInbound: "Late inbound coach"
    other: "Other"
  # The sentence the passenger receives. Short: it goes out by SMS, and a long
  # SMS costs several times what a short one does.
  summary:
    delay: "Now departing at {time}."
    cancellation: "This departure will not run."
    breakdownEnRoute: "The coach has broken down."
    equipmentSwap: "A different coach is assigned."
    diversion: "The route has changed."
    routeSuspension: "The route is suspended."
