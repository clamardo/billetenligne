# Traveller-journey error codes. The server never sends prose: it sends a code
# and parameters, and each surface renders the sentence in its reader's own
# language (ADR-0008).
errors:
  network:
    unreachable: "No connection. Check your network and try again."
    timeout: "The server is taking too long. Try again."
  client:
    unreadable: "This version of the app does not understand the server's reply. Please update it."
  request:
    bad: "Bad request."
    idempotency_key_reused: "This request was already handled with different contents."
    rate_limited: "Too many attempts. Wait a moment."
  auth:
    unauthorized: "Sign in to continue."
    forbidden: "You do not have access to this action."
  resource:
    not_found: "Not found."
    conflict: "This action is already in progress. Try again shortly."
  server:
    internal: "Something went wrong on our side. Try again."
    unavailable: "Service temporarily unavailable. Try again in a moment."
  refund:
    outside_window: "This ticket is no longer refundable under the terms it was sold with."
    fare_not_refundable: "The \"{fareCode}\" fare is not refundable."
    already_departed: "That departure has already left."
    no_policy: "This ticket was sold with no refund terms. A refund has to be decided by hand."
    not_confirmed: "This ticket was never paid for — there is nothing to refund."
    not_possible: "This ticket cannot be refunded."
    claim_not_open: "This refund code is not valid: unknown, already collected, or expired."
  hold:
    seat_unavailable: "Seat {seats} was just taken. Please choose another."
    expired: "Your reservation expired."
    already_consumed: "This reservation has already been used."
    expired_during_payment: "Your reservation expired during payment."
  departure:
    sold_out: "This departure is full."
    closed: "Sales are closed for this departure."
    cancelled: "This departure was cancelled by the operator."
  asset:
    unsupported_type: "That format is not accepted. Send a PNG, a JPEG or an SVG."
    too_large: "That file is too heavy. Maximum {maxKb} KB."
    too_wide: "That image is too large. Maximum {maxEdge} px per side."
    unreadable: "That file looks incomplete. Try exporting it again."
  storage:
    unavailable: "File upload is not available on this server."
