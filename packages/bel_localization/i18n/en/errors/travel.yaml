# Traveller-journey error codes. The server never sends prose: it sends a code
# and parameters, and each surface renders the sentence in its reader's own
# language (ADR-0008).
errors:
  network:
    unreachable: "No connection. Check your network and try again."
    timeout: "The server is taking too long. Try again."
  client:
    unreadable: "This version of the app does not understand the server's reply. Please update it."
  request:
    bad: "Bad request."
    idempotency_key_reused: "This request was already handled with different contents."
    rate_limited: "Too many attempts. Wait a moment."
  auth:
    unauthorized: "Sign in to continue."
    forbidden: "You do not have access to this action."
  resource:
    not_found: "Not found."
    conflict: "This action is already in progress. Try again shortly."
  server:
    internal: "Something went wrong on our side. Try again."
    unavailable: "Service temporarily unavailable. Try again in a moment."
  # The choice screen's refusals (08-disruption.md §3.2). Each says what
  # changed in the world rather than what the server rejected: at 04:00 the
  # useful sentence is "that coach just filled", not "conflict".
  choice:
    nothing_disrupted: "This trip is no longer disrupted. Your ticket stands as it is."
    window_closed: "The window for choosing has passed. Please see the company's counter."
    unknown_option: "That option no longer exists. Look at the ones that remain."
    no_longer_available: "That coach just filled. Please choose another option."
    party_does_not_fit: "There are not enough seats left for {seats} travellers on that coach."
  # The refusals of a self-service cancellation (01-feature-spec.md §8.2).
  # Each says what to do next: "the coach has left" sends somebody to a
  # counter, "a payment is in flight" asks them to wait thirty seconds.
  cancel:
    nothing_to_cancel: "This booking is already cancelled."
    coach_has_left: "This coach has already left. Please speak to the operator about what happens now."
    payment_in_flight: "A payment is going through on this booking. Wait for it to finish before cancelling."
    needs_the_agency: "This operator refunds as credit towards a future journey. Visit an agency to arrange it."
  # The refusals of a change of departure (01-feature-spec.md §8.1).
  change:
    too_late: "Less than {hours} h before departure: changes are no longer possible."
    already_departed: "This departure has already left."
    into_the_past: "That departure has already left."
    off_route: "That departure is not on the same route, or not with the same operator."
    same_departure: "That is the departure you already have."
    does_not_fit: "Only {available} seats are left on that coach, and there are {needed} of you."
    must_be_paid: "This change costs extra. Pay it to confirm the new departure."
    payment_in_flight: "A payment for a change is already under way. Wait for the answer before asking for another."
  refund:
    outside_window: "This ticket is no longer refundable under the terms it was sold with."
    fare_not_refundable: "The \"{fareCode}\" fare is not refundable."
    already_departed: "That departure has already left."
    no_policy: "This ticket was sold with no refund terms. A refund has to be decided by hand."
    not_confirmed: "This ticket was never paid for — there is nothing to refund."
    not_possible: "This ticket cannot be refunded."
    claim_not_open: "This refund code is not valid: unknown, already collected, or expired."
  application:
    already_exists: "You already have an application in progress. Finish it, or contact us to open a second one."
    not_found: "No application has been started with this account yet."
    locked: "Your application is under review. You will be able to edit it if we ask for anything more."
    incomplete: "Some information is still missing. Complete the steps flagged before sending."
  hold:
    seat_unavailable: "Seat {seats} was just taken. Please choose another."
    expired: "Your reservation expired."
    already_consumed: "This reservation has already been used."
    expired_during_payment: "Your reservation expired during payment."
  departure:
    sold_out: "This departure is full."
    closed: "Sales are closed for this departure."
    cancelled: "This departure was cancelled by the operator."
  asset:
    unsupported_type: "That format is not accepted. Send a PNG, a JPEG or an SVG."
    too_large: "That file is too heavy. Maximum {maxKb} KB."
    too_wide: "That image is too large. Maximum {maxEdge} px per side."
    unreadable: "That file looks incomplete. Try exporting it again."
  storage:
    unavailable: "File upload is not available on this server."
