# Outbound email. Rendered by the SERVER, in the recipient's stored language
# (ADR-0019 rule 3) — which is the only reason this catalog is shared between
# the clients and the API.
#
# No 160-character gate here, unlike SMS: email is not charged by the segment.
# Brevity is still right — plenty of people read this on a five-inch screen
# over 2G.
email:
  otp:
    subject: "Your BilletEnLigne code: {code}"
    body: |
      Your BilletEnLigne sign-in code is {code}.

      It expires in {minutes} minutes. Do not share it with anyone — we will
      never ask you for it.

      If you did not ask for this code, ignore this message: nobody can reach
      your account without it.
  booking:
    subject: "Your BilletEnLigne ticket {reference}"
    body: |
      Your seat is confirmed.

      {route} on {date} at {time}, seat {seat}.
      Reference {reference}.

      Your ticket is in the BilletEnLigne app. Show the QR code to the
      conductor — it works with no network.
  # The ticket, by link (ADR-0026). For the person who bought at a counter and
  # has no app: the link opens the ticket, the QR is on it, and it stays valid
  # until the day after the journey.
  ticketLink:
    attached: "Your ticket QR codes are attached to this message — keep them, they work with no signal."
    open: "Open my ticket"
    subject: "Your ticket {reference} — {route}"
    body: |
      Your ticket is ready.

      {route} on {date} at {time}, seat {seat}.
      Reference {reference}.

      Open your ticket here:
      {url}

      The QR codes are attached to this message: show them to the conductor.
      Keep this message — the images work with no signal. The link stays valid
      until the day after your journey.
  # A subject that says what happened, not what is promised.
  seatAvailable:
    subject: "Seats are free again: {route} on {date}"
  # A subject line carrying the date, because that is the one thing the reader
  # needs in order to know whether to open it now.
  complianceExpiring:
    subject: "{document}: expires {date}"
  complianceBlocked:
    subject: "Sales stopped: {document} expired on {date}"
  complianceSuspended:
    subject: "{operator} suspended: {document} expired on {date}"
  operatorApproved:
    subject: "{operator} is live on BilletEnLigne"
