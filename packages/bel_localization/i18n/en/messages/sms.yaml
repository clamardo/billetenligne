# Outbound SMS. SMS is the trust channel in this market (ADR-0013): anything
# involving money goes out on it. Stay under 160 characters where possible —
# a multipart SMS costs a multiple.
sms:
  otp:
    body: "Your BilletEnLigne code is {code}. It expires in {minutes} minutes. Don't share it with anyone."
  paymentConfirmed:
    body: "Payment confirmed. {route} on {date} at {time}, seat {seat}. Ref {reference}. Ticket is in the BilletEnLigne app."
  paymentPending:
    body: "We're verifying your {operator} payment of {amount}. Your seat is held. Ref {reference}."
  paymentFailed:
    body: "Payment did not go through for {route}. No amount was debited. Your seat is free for {minutes} min."
  refundIssued:
    body: "Refund of {amount} sent to {destination}. Expect it within {hours}h. Ref {reference}."
  # The refund the passenger chose themselves after a disruption
  # (08-disruption.md §3.2). It is collected in cash at an agency: rail
  # disbursement does not exist yet, and promising otherwise would be a lie.
  # The code goes by SMS because a code shown once is a code somebody loses.
  refundClaim:
    body: "Refund of {amount} approved. Collect it at any {operator} agency with code {code}. Ref {reference}."
  # The traveller cancelling their own booking (01-feature-spec.md §8.2). Two
  # versions, and what differs is what they have to do next: one carries a
  # code for a counter, the other a window. Neither says "sent" until the
  # disbursement has actually left.
  cancelledClaim:
    body: "Cancellation confirmed. Collect {amount} at any {operator} agency with code {code}. Ref {reference}."
  cancelledPending:
    body: "Cancellation confirmed. {amount} will be refunded within {hours}h to the payment method you used. Ref {reference}."
  ticketClaim:
    body: "Your ticket for {route} on {date} is waiting. Open BilletEnLigne and enter code {code}."
  departureReminder:
    body: "Reminder: {route} departs at {time} from {station}. Seat {seat}. Please arrive 30 min early."
  # Two versions, and the difference is not cosmetic. "No fees" is only true
  # when the disruption entitles the passenger to an exchange or a refund: a
  # fifteen-minute delay entitles them to nothing, and saying otherwise is a
  # promise the counter has to refuse.
  disruptionDeclared:
    body: "{operator}: {route} at {time}. {summary}"
    involuntary: "{operator}: your {route} departure at {time} is disrupted. {summary} No fees: exchange or full refund."
  disruptionResolved:
    body: "{operator}: new arrangement for {route}. Departs {date} at {time}, seat {seat}. No fees."
  # The passenger changes departure, not just seat. The old time is repeated
  # because it is the one they have in their head and on their ticket.
  rebooked:
    body: "{operator}: your {route} at {oldTime} is not running. You now travel {date} at {time}, seat {seat}. No fees. Ref {reference}."
  # The company name on the ticket changes, which is the most alarming thing
  # that can happen to one without warning — so the message leads with it.
  protected:
    body: "{operator} is taking you. {route} on {date} at {time}, seat {seat}. Same ticket, no charge. Ref {reference}."
