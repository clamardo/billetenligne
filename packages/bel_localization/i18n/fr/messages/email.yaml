# E-mails sortants. Rendus par le SERVEUR, dans la langue enregistrée du
# destinataire (ADR-0019 règle 3) — c'est la seule raison pour laquelle ce
# catalogue est partagé entre les clients et l'API.
#
# Pas de limite de 160 caractères ici, contrairement aux SMS : un e-mail ne
# coûte pas au segment. Rester bref reste une bonne idée — beaucoup de gens
# liront ça sur un écran de 5 pouces en 2G.
email:
  otp:
    subject: "Votre code BilletEnLigne : {code}"
    body: |
      Votre code de connexion BilletEnLigne est {code}.

      Il expire dans {minutes} minutes. Ne le communiquez à personne — nous ne
      vous le demanderons jamais.

      Si vous n'avez pas demandé ce code, ignorez ce message : personne ne peut
      accéder à votre compte sans lui.
  booking:
    subject: "Votre billet BilletEnLigne {reference}"
    body: |
      Votre place est confirmée.

      {route} le {date} à {time}, siège {seat}.
      Référence {reference}.

      Votre billet est dans l'application BilletEnLigne. Présentez le code QR
      au contrôleur — il fonctionne sans réseau.
  # Le billet, par lien (ADR-0026). Pour la personne qui a achete au guichet
  # et qui n'a pas l'application : le lien ouvre le billet, le QR est dedans,
  # et il reste valable jusqu'au lendemain du voyage.
  ticketLink:
    attached: "Les codes QR de vos billets sont joints à ce message — gardez-les, ils fonctionnent sans réseau."
    open: "Ouvrir mon billet"
    subject: "Votre billet {reference} — {route}"
    body: |
      Votre billet est prêt.

      {route} le {date} à {time}, siège {seat}.
      Référence {reference}.

      Ouvrez votre billet ici :
      {url}

      Les codes QR sont joints à ce message : présentez-les au contrôleur.
      Gardez ce message — les images fonctionnent sans réseau. Le lien, lui,
      reste valable jusqu'au lendemain du voyage.
  # Un sujet qui dit ce qui s'est passe, pas ce qui est promis.
  seatAvailable:
    subject: "Des places se liberent: {route} le {date}"
  # Un sujet qui donne la date, parce que c'est la seule information dont le
  # destinataire a besoin pour savoir s'il doit ouvrir maintenant.
  complianceExpiring:
    subject: "{document} : expiration le {date}"
  complianceBlocked:
    subject: "Vente arrêtée : {document} expirée le {date}"
  complianceSuspended:
    subject: "{operator} suspendu : {document} expirée depuis le {date}"
  # Le releve de versement (04-payments.md 6.2), envoye au moment ou l'argent
  # part. Le document est en piece jointe : un e-mail qui renvoie vers la
  # console est un e-mail qui oblige un comptable a se connecter, et il n'a pas
  # de compte.
  payoutStatement:
    subject: "Votre relevé de versement du {period}"
    body: |
      Votre versement de {amount} est parti.

      Période du {period}. Référence {reference}.

      Le relevé détaillé est joint à ce message, au format PDF. Vous le
      retrouvez aussi dans votre console, sous Versements.
  operatorApproved:
    subject: "{operator} est activé sur BilletEnLigne"
