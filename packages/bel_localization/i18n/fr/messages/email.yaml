# E-mails sortants. Rendus par le SERVEUR, dans la langue enregistrée du
# destinataire (ADR-0019 règle 3) — c'est la seule raison pour laquelle ce
# catalogue est partagé entre les clients et l'API.
#
# Pas de limite de 160 caractères ici, contrairement aux SMS : un e-mail ne
# coûte pas au segment. Rester bref reste une bonne idée — beaucoup de gens
# liront ça sur un écran de 5 pouces en 2G.
email:
  otp:
    subject: "Votre code BilletEnLigne : {code}"
    body: |
      Votre code de connexion BilletEnLigne est {code}.

      Il expire dans {minutes} minutes. Ne le communiquez à personne — nous ne
      vous le demanderons jamais.

      Si vous n'avez pas demandé ce code, ignorez ce message : personne ne peut
      accéder à votre compte sans lui.
  booking:
    subject: "Votre billet BilletEnLigne {reference}"
    body: |
      Votre place est confirmée.

      {route} le {date} à {time}, siège {seat}.
      Référence {reference}.

      Votre billet est dans l'application BilletEnLigne. Présentez le code QR
      au contrôleur — il fonctionne sans réseau.
  # Un sujet qui dit ce qui s'est passe, pas ce qui est promis.
  seatAvailable:
    subject: "Des places se liberent: {route} le {date}"
  # Un sujet qui donne la date, parce que c'est la seule information dont le
  # destinataire a besoin pour savoir s'il doit ouvrir maintenant.
  complianceExpiring:
    subject: "{document} : expiration le {date}"
  complianceBlocked:
    subject: "Vente arrêtée : {document} expirée le {date}"
  complianceSuspended:
    subject: "{operator} suspendu : {document} expirée depuis le {date}"
