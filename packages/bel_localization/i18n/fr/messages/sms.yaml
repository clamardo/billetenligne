# SMS sortants. Le SMS est le canal de confiance de ce marché (ADR-0013) :
# tout ce qui touche à l'argent y passe. Rester sous 160 caractères quand
# c'est possible — un SMS multipart coûte plusieurs fois le prix.
sms:
  otp:
    body: "Votre code BilletEnLigne est {code}. Il expire dans {minutes} minutes. Ne le communiquez à personne."
  paymentConfirmed:
    body: "Paiement confirmé. {route} le {date} a {time}, siege {seat}. Ref {reference}. Billet dans l'app BilletEnLigne."
  # Le billet, par lien (ADR-0026). Court parce que c'est un SMS et parce que
  # la seule action est d'ouvrir le lien : tout le reste est sur la page.
  ticketLink:
    body: "Votre billet {route} du {date} a {time}. Ouvrez-le ici : {url}"
  paymentPending:
    body: "Nous verifions votre paiement {operator} de {amount}. Votre place est reservee. Ref {reference}."
  paymentFailed:
    body: "Paiement non abouti pour {route}. Aucun montant n'a ete debite. Votre place est libre pendant {minutes} min."
  refundIssued:
    body: "Remboursement de {amount} envoye sur {destination}. Delai indicatif {hours}h. Ref {reference}."
  # Le remboursement choisi par le passager lui-meme apres une perturbation
  # (08-disruption.md §3.2), quand il n'y a pas de portefeuille ou vers lequel
  # renvoyer l'argent : billet paye en especes, ou par carte. Le code part par
  # SMS parce qu'un code affiche une seule fois est un code perdu.
  refundClaim:
    body: "Remboursement de {amount} accepte. Retirez-le dans une agence {operator} avec le code {code}. Ref {reference}."
  # Et quand il y a un portefeuille : le versement est parti vers le rail, la
  # confirmation arrive quand l'operateur mobile l'a credite. Ne dit pas
  # "recu" — c'est le message refundIssued qui le dira.
  refundOnItsWay:
    body: "Remboursement de {amount} accepte. Il repart vers {destination}, sous {hours}h. Ref {reference}."
  # L'annulation faite par le voyageur lui-meme (01-feature-spec.md §8.2).
  # Deux versions, et la difference porte sur ce qu'il doit faire ensuite :
  # l'une donne un code a presenter au guichet, l'autre annonce un delai.
  # Aucune ne dit "envoye" tant que le versement n'est pas parti.
  cancelledClaim:
    body: "Annulation confirmee. Retirez {amount} dans une agence {operator} avec le code {code}. Ref {reference}."
  cancelledPending:
    body: "Annulation confirmee. {amount} vous seront rembourses sous {hours}h sur le moyen de paiement utilise. Ref {reference}."
  ticketClaim:
    body: "Votre billet {route} du {date} vous attend. Ouvrez BilletEnLigne et entrez le code {code}."
  departureReminder:
    body: "Rappel: {route} demarre a {time} depuis {station}. Siege {seat}. Presentez-vous 30 min avant."
  # Deux versions, et la difference n'est pas cosmetique. "Aucun frais" n'est
  # vrai que si la perturbation ouvre droit a un echange ou un remboursement :
  # un retard de quinze minutes n'ouvre rien, et l'annoncer serait une
  # promesse que le guichet devra refuser.
  disruptionDeclared:
    body: "{operator}: {route} de {time}. {summary}"
    involuntary: "{operator}: {route} de {time} est perturbe. {summary} Aucun frais: echange ou remboursement integral."
  disruptionResolved:
    body: "{operator}: nouvelle solution pour {route}. Depart {date} a {time}, siege {seat}. Aucun frais."
  # Le passager change de depart, pas seulement de siege. L'ancienne heure est
  # rappelee parce que c'est celle qu'il a en tete et sur son billet.
  rebooked:
    body: "{operator}: {route} de {oldTime} ne part pas. Vous partez le {date} a {time}, siege {seat}. Aucun frais. Ref {reference}."
  # Le nom de la compagnie change : c'est ce qu'il y a de plus inquietant sur
  # un billet, donc le message commence par la. Le passager cherche un car qui
  # ne porte plus le meme nom que celui qu'il a reserve.
  # Le siege est reparu, il n'est pas reserve. Tout le monde recoit ce message
  # au meme instant et le premier qui paie l'emporte : dire "votre place vous
  # attend" enverrait quelqu'un a la gare pour un car deja plein.
  seatAvailable:
    body: "{seats} place(s) de nouveau en vente: {operator} {route} le {date} a {time}. Premier arrive, premier servi. Reservez dans BilletEnLigne."
  protected:
    body: "{operator} vous prend en charge. {route} le {date} a {time}, siege {seat}. Meme billet, aucun frais. Ref {reference}."
  # Conformite (03-operator-lifecycle.md §3.3). Adresses a l'operateur, pas au
  # voyageur, et toujours au directeur : c'est lui qui peut renouveler une
  # piece. Chaque message dit ce qui se passera ensuite — personne ne doit
  # decouvrir l'arret des ventes le jour ou il tombe.
  complianceExpiring:
    body: "BilletEnLigne: votre {document} expire le {date} ({days} j). Mettez-la a jour dans la console, sinon la vente de billets s'arretera."
  complianceBlocked:
    body: "BilletEnLigne: {document} expiree le {date}. La vente est arretee, les billets deja vendus restent valables. Mettez la piece a jour."
  complianceSuspended:
    body: "BilletEnLigne: {operator} suspendu, {document} expiree depuis le {date}. Vos departs vendus sont assures. Contactez-nous."
  # L'operateur peut vendre. Dit l'etape suivante, pas un changement d'etat :
  # "votre dossier est approuve" laisse quelqu'un attendre un second message.
  operatorApproved:
    body: "BilletEnLigne: {operator} est active. Connectez-vous a la console pour creer vos lignes et vos departs, et vendre vos premiers billets."
