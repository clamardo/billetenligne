    paidLabel: "Net à verser"
    owed: "Vous nous devez ce montant"
    online: "Ventes en ligne"
    cash: "Ventes guichet (espèces)"
    tickets: "{count} billet(s) · {amount}"
    cashNote: "Les ventes en espèces ne sont jamais versées : vous détenez déjà cet argent. Seuls les frais de service sont déduits."
    commission: "Commission"
    refunds: "Remboursements émis"
    tills: "Espèces en caisse (déduites)"
    paidOn: "Versé"
    paidWith: "{date} · référence {reference}"
    download: "Télécharger le relevé (PDF)"
    state:
      draft: "Préparé"
      approved: "Approuvé"
      paid: "Versé"
      void: "Annulé"
  # Les accords de protection inter-opérateurs (08-disruption.md §5). Ce qui
