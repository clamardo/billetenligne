    note: "Précision"
    partial: "{covered} sur {total} seulement. Les autres resteront sur place."
    movesNow: "En acceptant, les passagers changent de compagnie tout de suite et reçoivent un nouveau billet."
    accept: "Accepter"
    decline: "Refuser"
  # Protection ouverte (08-disruption.md §5) : l'appel lancé à toute la route
