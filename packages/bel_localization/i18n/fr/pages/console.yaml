    declare: "Signaler un incident"
    rescue: "Car de secours"
    rebook: "Reloger les passagers"
    protect: "Demander à une autre compagnie"
  # Le formulaire du régulateur, au bord de la route, sur un téléphone, en 2G,
  # parfois sous la pluie (08-disruption.md §2.1). Quatre grandes cibles, une
  # cause, et rien d'autre d'obligatoire.
  disruption:
    title: "Que s'est-il passé ?"
    cause: "Cause"
    note: "Précision (facultatif)"
    noteHint: "Ce que verront les passagers, en plus du message type."
    later: "Nouveau départ"
    plus30: "+30 min"
    plus60: "+1 h"
    plus120: "+2 h"
    plus240: "+4 h"
    back: "Retour"
    confirm: "Signaler"
    willTell: "{count} passager(s) seront prévenus immédiatement."
    free: "Échange ou remboursement intégral, sans frais."
    notFree: "Moins d'une heure de retard : pas de remboursement automatique."
    needsTime: "Choisissez le nouveau départ."
    badge: "Perturbé"
  # Le car de secours (08-disruption.md §2.2, option ①). Le régulateur choisit
  # un car qui existe vraiment, et le nombre de places est dit avant le choix.
  rescue:
    title: "Remplacer {vehicle}"
    none: "Aucun car disponible. Voyez le guichet pour reloger les passagers."
    seats: "{count} places"
    short: "{count} places de moins"
    note: "Précision (facultatif)"
    noteHint: "Ce que verront les passagers, en plus du message type."
    willMove: "{count} passager(s) recevront un nouveau billet et une nouvelle place."
    back: "Retour"
    confirm: "Envoyer ce car"
  # Le report sur un autre départ (08-disruption.md §2.2, option ②). La
  # couverture est affichée par candidat : « 18 sur 42 » est le nombre sur
  # lequel le régulateur enchaîne.
  rebook:
    title: "Reloger {count} passager(s)"
    none: "Aucun autre départ sur cette ligne aujourd'hui. Essayez un car de secours."
    covers: "{covered} sur {total}"
    note: "Précision (facultatif)"
    noteHint: "Ce que verront les passagers, en plus du message type."
    back: "Retour"
    confirm: "Reloger"
  # Le relevé hebdomadaire, côté compagnie (04-payments.md §6.2). En lecture
  # seule : celui qui est payé ne déplace pas la ligne qui le paie.
  statements:
    title: "Vos versements"
    subtitle: "Un relevé par période. Les ventes guichet y figurent, elles ne sont jamais versées."
    emptyTitle: "Aucun relevé pour l'instant"
    emptyBody: "Votre premier relevé apparaîtra ici après la première période de vente."
