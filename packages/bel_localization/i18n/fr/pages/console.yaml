  # Demander de la place à une autre compagnie (08-disruption.md §2.2,
  # option ③). Rien ne bouge à l'envoi : la demande arrive sur leur console et
  # attend une personne. La phrase le dit deux fois, parce que le régulateur
  # qui croit ses passagers placés arrête de chercher un car.
