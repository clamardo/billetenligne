    title: "Placer {count} passager(s) chez une autre compagnie"
    none: "Aucune compagnie avec un accord en vigueur n'a de place sur cette ligne aujourd'hui."
    seats: "{count} places libres"
    covers: "{covered} sur {total}"
    note: "Précision (facultatif)"
    noteHint: "Ce que verra le régulateur d'en face."
    waits: "Rien ne bouge tant qu'ils n'ont pas répondu. Continuez à chercher une solution."
    back: "Retour"
    confirm: "Demander"
  # La file des demandes reçues (08-disruption.md §2.3). Un accord se lit une
  # fois par trimestre ; une demande, c'est quelqu'un qui attend à la gare.
  request:
    title: "Demandes en cours"
    theyAsked: "{name} demande {count} place(s)."
    weAsked: "Vous demandez {count} place(s)."
