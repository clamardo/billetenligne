  # Où les gens s'arrêtent (04-payments.md §8). L'écran dit d'abord ce qu'il
  # ne mesure pas : la recherche ne laisse aucune trace, donc le premier
  # chiffre est la place bloquée, pas la recherche lancée.
  funnel:
    title: "Où les gens s'arrêtent"
    countsFrom: "Le comptage commence à la place bloquée. Les recherches ne sont enregistrées nulle part : rien ici ne dit combien de personnes ont regardé sans réserver."
