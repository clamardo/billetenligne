  # L'écran Conformité (03-operator-lifecycle.md §6). Un calendrier, pas une
  # file : rien n'y arrive parce que quelqu'un a déposé un dossier, et
  # l'échéance tombe que l'onglet ait été ouvert ou non — le worker arrête les
  # ventes tout seul. Ce que cet écran sert, c'est la quinzaine d'avant.
  compliance:
    title: "Conformité"
    subtitle: "{count} compagnie(s) dont une pièce arrive à échéance."
    window: "{days} jours"
    open: "Ouvrir le dossier"
    blocked: "Vente arrêtée : {document} expirée."
    remainingDays: "dans {days} j"
    lapsedDays: "expirée depuis {days} j"
    emptyTitle: "Rien à relancer"
    emptyBody: "Aucune pièce n'arrive à échéance dans cette fenêtre. Élargissez-la pour voir plus loin."
  # Pourquoi une candidature n'est pas dans la bande du dessous. Des motifs,
  # jamais un score : un score fait discuter du seuil et cache la case qui a
  # échoué. Jamais montrés au candidat — dire à quelqu'un quel contrôle il a
  # raté, c'est lui donner l'outil pour le contourner.
  risk:
    incomplete: "dossier incomplet"
    fleet_too_large: "flotte au-dessus du seuil automatique"
    departures_too_many: "trop de départs quotidiens"
    settlement_name_mismatch: "nom du compte différent du nom légal"
    licence_runway: "licence à échéance rapprochée"
    insurance_runway: "assurance à échéance rapprochée"
