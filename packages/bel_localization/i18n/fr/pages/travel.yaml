  # L'écran de choix du passager (08-disruption.md §3.2). Trois règles y sont
  # tenues : une option est déjà attribuée — personne n'est laissé sans place
  # pendant qu'il réfléchit —, chaque ligne dit l'heure d'ARRIVÉE, et le
  # remboursement est toujours là, en dernier, jamais caché.
