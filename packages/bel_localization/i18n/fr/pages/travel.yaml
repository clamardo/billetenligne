    paymentComingSoon: "Le paiement Mobile Money arrive bientôt. Votre place reste réservée jusqu'à la fin du compte à rebours."
    seatsLabel: "Places {seats}"
  passengers:
    title: "Qui voyage ?"
    intro: "Le nom sert au contrôle à bord. Le numéro reçoit le billet par SMS."
