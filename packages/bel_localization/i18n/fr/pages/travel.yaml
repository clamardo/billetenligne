    voidedTitle: "Billet annulé"
    voidedBody: "Ce billet a été remboursé ou annulé. Il ne permet plus d'embarquer."
    boardBy: "Embarquement jusqu'à {time}"
    arrivesAtStation: "Arrivée à {station}"
    # Pendant une perturbation, ce billet EST le canal d'information
    # (08-disruption.md §3.3). Ce que la compagnie a déclaré, où, et ce que
    # cela ouvre comme droit — avant tout le reste sur l'écran.
    disrupted: "{kind} signalé par {operator}"
    disruptedAt: "Vers {place}"
    disruptedNewTime: "Nouveau départ prévu à {time}"
    disruptedFree: "Aucun frais : échange ou remboursement intégral."
    disruptedCounter: "Présentez-vous au guichet {operator} ou appelez l'agence."
  # L'écran de choix du passager (08-disruption.md §3.2). Trois règles y sont
  # tenues : une option est déjà attribuée — personne n'est laissé sans place
  # pendant qu'il réfléchit —, chaque ligne dit l'heure d'ARRIVÉE, et le
  # remboursement est toujours là, en dernier, jamais caché.
  choice:
    open: "Voir vos options"
    title: "Votre voyage est perturbé"
    loading: "Chargement de vos options…"
    trip: "{origin} → {destination} · {date} · {time}"
    at: "Panne près de {place}"
    lead: "Choisissez — sans frais :"
    assigned: "ATTRIBUÉ"
    keep: "Je garde"
    pick: "Choisir"
    departsAt: "Départ de {time}"
    arrives: "Arrivée {time}"
    seat: "siège {seats}"
    seats:
      one: "{count} place"
      other: "{count} places"
    partial: "{covered} places sur {needed}"
    full: "Complet"
    otherOperator: "Autre compagnie"
    refundTitle: "Remboursement intégral"
    refundBody: "{amount}, à retirer au guichet"
    # L'ambiguïté à 4 h du matin coûte plus cher qu'une règle qui déplaît.
    fallback: "Sans réponse avant {time}, nous vous gardons sur la place attribuée."
    closed: "Le délai de choix est passé. Présentez-vous au guichet de la compagnie."
    keptTitle: "Vous gardez votre place"
    keptBody: "Rien ne change. Votre billet reste valable."
    movedTitle: "Vous êtes replacé"
    movedBody: "Départ à {time} · {seats}"
    movedTicket: "Votre nouveau billet est prêt. L'ancien ne permet plus d'embarquer."
    refundedTitle: "Remboursement enregistré"
    refundedBody: "{amount} vous seront remis au guichet de la compagnie."
    claimCode: "Code de retrait"
    claimHelp: "Notez-le. Il vous est aussi envoyé par SMS."
    done: "Retour à mes billets"
  # Partager son trajet (ADR-0014 §2). Le cas d'usage est précis et très
  # courant ici : un proche qui fait les 512 km de la RN1, et quelqu'un à
  # l'arrivée qui veut savoir quand partir pour la gare. Aujourd'hui cela se
  # règle en crédit téléphonique et en appels répétés.
  share:
    action: "Partager mon trajet"
    title: "Partager mon trajet"
    lead: "{origin} → {destination}, {date}. Envoyez un lien à quelqu'un qui vous attend."
    whatTheySee: "Ce que cette personne verra"
    seeRoute: "La ligne, la compagnie et les horaires"
    seeProgress: "L'avancement du car, avec le niveau de précision indiqué"
    seeDisruption: "Un retard ou une panne, dès que la compagnie le signale"
    # La question que se pose vraiment quelqu'un avant d'envoyer un lien dans
    # un groupe.
    neverSee: "Jamais votre siège, ni le prix payé, ni votre numéro. Cette page suit un car, pas une personne."
    create: "Créer le lien"
    linkLabel: "Lien à partager"
    linkHidden: "Lien déjà créé — recréez-en un si vous l'avez perdu."
    opens:
      one: "{count} personne a ouvert ce lien"
      other: "{count} personnes ont ouvert ce lien"
    expires: "Le lien cesse de fonctionner le {date} à {time}"
    revoke: "Retirer le lien"
    revokeHint: "Le lien cesse immédiatement de fonctionner. Vous pourrez en créer un autre."
  # L'annulation faite par le voyageur (01-feature-spec.md §8.2). L'écran doit
  # répondre à trois questions dans cet ordre : qu'est-ce que j'annule, qu'est-
  # ce que je récupère, et où. Le mot « remboursement » n'apparaît jamais quand
  # rien n'a été payé — une réservation impayée se libère, elle ne se
  # rembourse pas.
  cancel:
    action: "Annuler ce voyage"
    title: "Annuler ce voyage"
    lead: "{origin} → {destination}, {date}"
    seats:
      one: "{count} place"
      other: "{count} places"
    releaseTitle: "Rien n'a été payé"
    releaseBody: "Cette réservation n'a jamais été réglée. L'annuler libère la place et ne vous coûte rien."
    releaseConfirm: "Annuler la réservation"
    releaseDone: "Réservation annulée. La place est de nouveau en vente."
    refundTitle: "Ce que vous récupérez"
    paid: "Payé"
    refundable: "Remboursé"
    retained: "Retenu"
    # Dit en toutes lettres plutôt qu'affiché « 0 FCFA » : un zéro à côté d'un
    # bouton de confirmation n'est lu par personne.
    nothingBack: "Les conditions de vente ne prévoient plus de remboursement à ce stade. Annuler libère la place mais ne vous rend rien."
    atCounter: "Vous recevrez un code à présenter dans une agence {operator}."
    toSource: "Le montant repart sur le moyen de paiement utilisé, sous {hours} heures. Nous vous préviendrons à l'arrivée."
    terms: "Conditions de vente"
    confirm: "Confirmer l'annulation"
    keep: "Garder mon billet"
    irreversible: "L'annulation est définitive. La place repart en vente immédiatement."
    doneTitle: "Voyage annulé"
    doneClaim: "Retirez {amount} dans une agence {operator} avec ce code"
    doneClaimExpires: "Code valable jusqu'au {date}"
    donePending: "{amount} vous seront remboursés sous {hours} heures sur le moyen de paiement utilisé."
    doneNothing: "La place a été libérée. Aucun montant ne vous est dû selon les conditions de vente."
    doneSms: "Nous vous envoyons aussi ce message par SMS."
    close: "Fermer"
  # Le changement de départ (01-feature-spec.md §8.1). Chaque ligne porte son
  # prix avant la sélection : quelqu'un qui parcourt une liste compare des
  # prix, et un écran qui ne chiffre que la ligne touchée oblige à toucher
  # cinq fois.
  change:
    action: "Modifier mon départ"
    title: "Changer de départ"
    lead: "{origin} → {destination}. Vous avez le départ de {time}, le {date}."
    seats:
      one: "{count} place"
      other: "{count} places"
    free: "Gratuit"
    plus: "+ {amount}"
    feeLine: "dont {amount} de frais de changement"
    seatsLeft:
      one: "{count} place libre"
      other: "{count} places libres"
    arrives: "Arrivée {time}"
    # Dit avant la sélection, jamais après : un départ moins cher ne rend rien.
    cheaperKeepsFare: "Un départ moins cher ne modifie pas le prix payé."
    involuntary: "La compagnie a modifié votre départ : tout changement est gratuit."
    # Le montant est sur le bouton, pas seulement au-dessus : on lit le
    # chiffre sur ce qu'on appuie.
    pay: "Payer {amount}"
    payAtAgency: "À régler en agence"
    heldFor: "Places gardées {minutes} min, le temps du paiement."
    # Un changement déjà en attente de paiement. Affiché au-dessus de la
    # liste : sans cette carte, les places restent gardées un quart d'heure
    # sans que rien ne le dise, et la seule sortie était d'attendre.
    pendingTitle: "Changement en attente de paiement"
    pending: "Places gardées sur le départ de {time}, le {date}. Reste à payer : {amount}."
    pendingUntil: "Gardées jusqu'à {time}."
    pendingPay: "Payer"
    pendingCancel: "Annuler ce changement"
    terms: "Conditions de changement"
    none: "Aucun autre départ de cette compagnie sur cette ligne dans les sept prochains jours."
    confirm: "Prendre ce départ"
    doneTitle: "Départ modifié"
    doneBody: "Vous êtes sur le départ de {time}, le {date}."
    doneSeats: "Nouvelles places : {seats}"
    doneTicket: "Votre billet a été réémis. L'ancien ne fonctionne plus."
    close: "Voir mon billet"
  reserved:
    title: "Réservation confirmée"
    payAtAgency: "Présentez ce code dans une agence {operator} pour payer."
    codeLabel: "Code de paiement"
    reference: "Référence"
    route: "Trajet"
    departure: "Départ"
    seats: "Sièges"
    fare: "Places"
    serviceFee: "Frais de service"
    total: "Total à payer"
    deadline: "À payer avant {time}, sinon les places repartent en vente."
    afterPayment: "Une fois payé, votre billet apparaît ici avec son code QR."
    payNow: "Payer maintenant par mobile money"
    payLater: "Payer à l'agence"
