  tickets:
    title: "Mes billets"
    open: "Mes billets"
    loading: "Chargement de vos billets…"
    upcoming: "À venir"
    past: "Voyages passés"
    emptyTitle: "Aucun billet pour l'instant"
    emptyBody: "Vos billets apparaîtront ici dès qu'un paiement est confirmé."
    emptyAction: "Rechercher un départ"
    staleTitle: "Pas de réseau"
    staleBody: "Ces billets datent de votre dernière connexion. Ils restent valables : le QR code fonctionne hors ligne."
    unpaid: "À payer"
    unpaidHint: "Code {code} · à régler avant {time}"
    cancelled: "Annulé"
