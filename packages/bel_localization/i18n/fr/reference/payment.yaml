# Libellés des moyens de paiement. Les identifiants (cg.airtel_money) et les
# codes USSD viennent de config/markets.yaml ; seuls les mots sont ici.
enum:
  PaymentRailKind:
    mobileMoney: "Mobile Money"
    card: "Carte bancaire"
    cash: "Espèces"
    bankTransfer: "Virement bancaire"
  # Le rail utilisé par défaut lorsqu'aucun portefeuille réel de ce
  # déploiement n'a d'identifiants. Il n'apparaît qu'en développement et en
  # démonstration, mais il y apparaît sur un vrai écran, et un écran qui
  # affiche `enum.PaymentRail.cg.fake_money` apprend à tout le monde à ignorer
  # les clés non traduites.
  PaymentRail:
    cg.fake_money: "Portefeuille de test — aucun argent réel"
payment:
  rail:
    comingSoon: "Bientôt disponible"
    temporarilyUnavailable: "Momentanément indisponible"
    notAvailableForNumber: "Indisponible pour ce numéro"
