# Erreurs d'identification. Le serveur n'envoie jamais de phrase : il envoie un
# code et des paramètres (ADR-0008).
#
# Aucune de ces phrases ne dit si une adresse est déjà connue. L'inscription et
# la connexion sont un seul parcours, et une API qui ne le dit pas ne peut pas
# servir à énumérer nos clients.
errors:
  email:
    invalid: "Cette adresse e-mail ne semble pas valide."
  phone:
    invalid: "Ce numéro ne semble pas valide. Exemple : 06 123 45 67."
  otp:
    incorrect: "Code incorrect. Il vous reste {remaining} essai(s)."
    expired: "Ce code n'est plus valable. Demandez-en un nouveau."
    too_many_attempts: "Trop d'essais. Demandez un nouveau code."
    resend_too_soon: "Patientez encore {seconds} s avant de demander un nouveau code."
    source_rate_limited: "Trop de demandes de code depuis cette connexion. Réessayez dans {seconds} s."
  auth:
    # Le code était bon et le serveur l'a confirmé. Ce qui a échoué ensuite est
    # l'échange du jeton, dont le voyageur n'est pas responsable : la phrase dit
    # ce qui s'est passé, et que les six chiffres affichés sont désormais
    # consommés.
    not_completed: "Votre code était correct, mais la connexion n'a pas abouti. Ce code est maintenant utilisé, demandez-en un nouveau."
  mfa:
    incorrect: "Code incorrect. Il vous reste {remaining} essai(s)."
    expired: "Cette connexion a expiré. Recommencez."
    locked: "Trop d'essais. Réessayez dans {seconds} s."
    enrolment_required: "Configurez d'abord votre application d'authentification."
    already_enrolled: "Une application d'authentification est déjà configurée sur ce compte."
