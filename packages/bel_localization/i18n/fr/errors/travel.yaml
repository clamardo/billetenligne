# Codes d'erreur du parcours voyageur. Le serveur n'envoie jamais de phrase :
# il envoie un code et des paramètres, et chaque surface rend la phrase dans la
# langue de son lecteur (ADR-0008).
errors:
  network:
    unreachable: "Pas de connexion. Vérifiez votre réseau et réessayez."
    timeout: "Le serveur met trop de temps à répondre. Réessayez."
  client:
    unreadable: "Cette version de l'application ne comprend pas la réponse du serveur. Mettez-la à jour."
  request:
    bad: "Demande incorrecte."
    idempotency_key_reused: "Cette demande a déjà été traitée avec un contenu différent."
    rate_limited: "Trop de tentatives. Patientez un instant."
  auth:
    unauthorized: "Connectez-vous pour continuer."
    forbidden: "Vous n'avez pas accès à cette action."
  # ADR-0026. Le lien vers le billet : ce qui peut échouer est toujours un
  # fait sur le monde — pas encore payé, rien où l'envoyer — parce que le
  # vendeur est debout devant le client et doit savoir quoi dire.
  ticketLink:
    unknown_booking: "Cette réservation est introuvable."
    nothing_to_send: "Ce billet n'est pas encore payé : il n'y a rien à envoyer."
    channel_unavailable: "L'envoi par SMS n'est pas encore disponible. Utilisez l'e-mail."
    no_destination: "Aucune adresse pour l'envoi. Demandez-la au client et saisissez-la."
  resource:
    not_found: "Introuvable."
    conflict: "Cette action est déjà en cours. Réessayez dans un instant."
  server:
    internal: "Une erreur est survenue de notre côté. Réessayez."
    unavailable: "Service momentanément indisponible. Réessayez dans quelques instants."
  # Les refus de l'écran de choix (08-disruption.md §3.2). Chacun dit ce qui a
  # changé dans le monde, pas ce que le serveur a rejeté : à 4 h du matin, la
  # phrase utile est « ce car vient de se remplir », pas « conflit ».
  choice:
    nothing_disrupted: "Ce voyage n'est plus perturbé. Votre billet reste valable tel quel."
    window_closed: "Le délai de choix est passé. Présentez-vous au guichet de la compagnie."
    unknown_option: "Cette option n'existe plus. Regardez celles qui restent."
    no_longer_available: "Ce car vient de se remplir. Choisissez une autre option."
    party_does_not_fit: "Il ne reste pas assez de places pour {seats} voyageurs sur ce car."
  # Les refus de l'annulation en libre-service (01-feature-spec.md §8.2).
  # Chacun dit ce qu'il faut faire ensuite : « le car est parti » envoie au
  # guichet, « un paiement est en cours » demande d'attendre trente secondes.
  cancel:
    nothing_to_cancel: "Cette réservation est déjà annulée."
    coach_has_left: "Ce car est déjà parti. Pour la suite, adressez-vous à la compagnie."
    payment_in_flight: "Un paiement est en cours sur cette réservation. Attendez qu'il aboutisse avant d'annuler."
    needs_the_agency: "Cette compagnie rembourse en avoir sur un prochain voyage. Passez à une agence pour l'obtenir."
  # Les refus de changement de départ (01-feature-spec.md §8.1).
  change:
    too_late: "Il reste moins de {hours} h avant le départ : le changement n'est plus possible."
    already_departed: "Ce départ a déjà eu lieu."
    into_the_past: "Ce départ est déjà passé."
    off_route: "Ce départ n'est pas sur la même ligne, ni avec la même compagnie."
    same_departure: "C'est le départ que vous avez déjà."
    does_not_fit: "Il ne reste que {available} places sur ce car, et vous êtes {needed}."
    must_be_paid: "Ce changement demande un supplément. Payez-le pour confirmer le nouveau départ."
    payment_in_flight: "Un paiement est déjà en cours pour un changement. Attendez la réponse avant d'en demander un autre."
  # Le voyageur qui a raté son car (06-fleet-and-routes.md). Ces phrases sont
  # lues à voix haute au guichet : elles disent ce que la compagnie fait, pas
  # ce que le système refuse.
  missed:
    not_offered: "Cette compagnie ne reporte pas un billet non utilisé au départ."
    window_closed: "Le report n'est possible que dans les {hours} h suivant le départ. Ce délai est passé."
    not_yet: "Ce car n'est pas encore parti. Il s'agit d'un changement de départ, pas d'un report."
    needs_a_till: "Ce report est payant : ouvrez une caisse pour encaisser."
  refund:
    outside_window: "Ce billet n'est plus remboursable selon les conditions de vente."
    fare_not_refundable: "Le tarif « {fareCode} » n'est pas remboursable."
    already_departed: "Ce départ a déjà eu lieu."
    no_policy: "Ce billet a été vendu sans conditions de remboursement. Le remboursement doit être décidé à la main."
    not_confirmed: "Ce billet n'a pas été payé — il n'y a rien à rembourser."
    not_possible: "Ce billet ne peut pas être remboursé."
    claim_not_open: "Ce code de remboursement n'est pas valable : inconnu, déjà encaissé ou expiré."
  application:
    already_exists: "Vous avez déjà une demande en cours. Terminez-la ou contactez-nous pour en ouvrir une seconde."
    not_found: "Aucune demande n'a encore été commencée avec ce compte."
    locked: "Votre demande est en cours d'examen. Vous pourrez la modifier si nous vous demandons un complément."
    incomplete: "Il manque encore des informations. Complétez les étapes signalées avant d'envoyer."
  hold:
    seat_unavailable: "La place {seats} vient d'être prise. Choisissez-en une autre."
    expired: "Votre réservation a expiré."
    already_consumed: "Cette réservation a déjà été utilisée."
    expired_during_payment: "Votre réservation a expiré pendant le paiement."
  departure:
    sold_out: "Ce départ est complet."
    closed: "Les ventes sont fermées pour ce départ."
    cancelled: "Ce départ a été annulé par la compagnie."
  asset:
    unsupported_type: "Format non accepté. Envoyez un PNG, un JPEG ou un SVG."
    too_large: "Fichier trop lourd. Maximum {maxKb} Ko."
    too_wide: "Image trop grande. Maximum {maxEdge} px de côté."
    unreadable: "Ce fichier semble incomplet. Réessayez l'export."
  storage:
    unavailable: "L'envoi de fichiers n'est pas disponible sur ce serveur."
