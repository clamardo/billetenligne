# Les phrases d'une politique de remboursement, générées à partir des chiffres
# que l'opérateur a saisis (ADR-0015 règle 3) : l'opérateur ne rédige jamais
# le texte, il répond à des questions. Encodées `clé|arg`, rendues a1, a2.
policy:
  line:
    noRefund: "Aucun remboursement en cas d'annulation."
    tierFull: "Jusqu'à {a1} h avant le départ : remboursement intégral."
    tier: "Jusqu'à {a1} h avant le départ : {a2} % remboursés."
    tierWithFee: "Jusqu'à {a1} h avant le départ : {a2} % remboursés, moins {a3} de frais."
    after: "Moins de {a1} h avant le départ : aucun remboursement."
    window: "Remboursement effectué sous {a1} h."
    feeKept: "Les frais de service ne sont pas remboursés."
    feeRefunded: "Les frais de service sont également remboursés."
    nonRefundable: "Tarifs non remboursables : {a1}."
    platformFloor: "Si le transporteur annule ou tombe en panne, vous êtes remboursé intégralement, quoi qu'il arrive."
    destination:
      source: "Remboursé sur votre moyen de paiement."
      agencyCash: "Remboursé en espèces, à l'agence, en personne."
      creditNote: "Remboursé en avoir, valable sur un prochain voyage."
      travellerChoice: "Vous choisissez comment être remboursé."
  # Les conditions de changement de départ (ADR-0012 D-08). Mêmes règles :
  # l'opérateur donne trois chiffres, nous écrivons les phrases.
  change:
    free: "Changement gratuit jusqu'à {a1} h avant le départ."
    fee: "Entre {a1} h et {a2} h avant le départ : {a3} % du prix payé."
    noFee: "Entre {a1} h et {a2} h avant le départ : changement gratuit."
    cutoff: "Moins de {a1} h avant le départ : changement impossible."
    involuntaryFree: "Si la compagnie modifie ou annule votre départ, le changement est gratuit, quoi qu'il arrive."
  # Le voyageur qui a raté son car. Deux chiffres, et « rien » est une
  # réponse : honorer un billet raté est une promesse commerciale, pas un
  # comportement de plateforme.
  missed:
    notOffered: "Un billet non utilisé au départ n'est pas reporté."
    free: "Car raté : report gratuit sur un départ des {a1} h qui suivent."
    fee: "Car raté : report possible dans les {a1} h, contre {a2} % du prix payé."

# Le dossier d'inscription d'un transporteur (03-operator-lifecycle.md §2.2).
# Le domaine renvoie des NOMS DE CHAMPS — `rccmNumber`, `ownerPhone` — jamais
# des phrases : c'est la même liste qui alimente la barre de progression du
# demandeur et la liste de contrôle de l'examinateur, et deux implémentations
# de « ce qui manque » finissent toujours par diverger.
application:
  step:
    entreprise: "Entreprise"
    dirigeant: "Dirigeant"
    licences: "Licences"
    exploitation: "Exploitation"
    encaissement: "Encaissement"
    accord: "Accord"
  field:
    legalName: "Raison sociale"
    tradingName: "Nom commercial"
    rccmNumber: "Numéro RCCM (registre du commerce)"
    taxId: "Numéro NIU (identifiant fiscal)"
    legalForm: "Forme juridique"
    registeredAddress: "Siège social"
    yearFounded: "Année de création"
    ownerName: "Nom complet du dirigeant"
    ownerIdType: "Type de pièce d'identité"
    ownerIdNumber: "Numéro de la pièce"
    ownerPhone: "Téléphone du dirigeant"
    ownerEmail: "E-mail du dirigeant"
    transportLicenceNumber: "Numéro de licence de transport"
    transportLicenceExpires: "Expiration de la licence"
    insurerName: "Assureur de la flotte"
    fleetInsuranceExpires: "Expiration de l'assurance"
    routesServed: "Lignes desservies"
    fleetSize: "Nombre de cars"
    stationCount: "Nombre d'agences"
    dailyDepartures: "Départs par jour"
    settlementKind: "Type de compte d'encaissement"
    settlementAccountName: "Nom du titulaire du compte"
    settlementAccountRef: "Numéro du compte ou du portefeuille"
    agreement: "Acceptation des conditions"

# Perturbations (08-disruption.md). Le libellé et la cause voyagent en clés,
# jamais en prose : le serveur envoie `disruption.kind.delay`, le client rend
# la phrase dans la langue du lecteur (ADR-0008).
disruption:
  kind:
    delay: "Retard"
    cancellation: "Annulation"
    breakdownEnRoute: "Panne en route"
    equipmentSwap: "Changement de car"
    diversion: "Déviation"
    routeSuspension: "Ligne suspendue"
  cause:
    mechanical: "Panne mécanique"
    roadClosed: "Route coupée"
    weather: "Météo"
    security: "Sécurité"
    noDriver: "Pas de chauffeur"
    noVehicle: "Pas de car disponible"
    checkpoint: "Barrage / contrôle"
    lateInbound: "Car entrant en retard"
    other: "Autre"
  # La phrase envoyée au passager. Courte : elle part en SMS, et un SMS long
  # coûte plusieurs fois le prix d'un court.
  summary:
    delay: "Nouveau départ prévu à {time}."
    cancellation: "Ce départ n'aura pas lieu."
    breakdownEnRoute: "Le car est immobilisé."
    equipmentSwap: "Un autre car est affecté."
    diversion: "L'itinéraire est modifié."
    routeSuspension: "La ligne est suspendue."
