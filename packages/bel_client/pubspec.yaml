name: bel_client
description: >-
  Typed HTTP client for the BilletEnLigne API. Shared unchanged by the
  traveller app, the operator console and the admin back office — one place
  that knows about retries, idempotency keys and what "offline" means.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
dependencies:
  bel_contracts: ^0.1.0
  bel_domain: ^0.1.0
  http: ^1.2.0
dev_dependencies:
  # Only the live suite needs it: computing a real TOTP code is the only way to
  # prove the enrolment round trip over a socket, and inventing an HMAC-SHA1
  # here would be proving the test rather than the server.
  bel_crypto: ^0.1.0
  test: ^1.25.0
